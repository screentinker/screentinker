  /groups/{id}/command:
    post:
      tags: [groups]
      summary: Send an operational command to every device in a group
      description: |
        Sends reboot / shutdown / screen on/off / launch / update to all devices
        in the group. Requires scope: full (the highest scope; tokens with only
        read or write are rejected).
      x-required-scope: full
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  # Kept identical to server/lib/device-command.js ALLOWED_COMMANDS, which both the
                  # group and the single-device route validate against. openapi-contract.test.js
                  # asserts the two lists match: this one had already drifted, documenting six of
                  # the commands a 'full' token can actually send.
                  enum: [screen_on, screen_off, launch, update, reboot, shutdown,
                         power_menu, lock_now, kiosk_lock, kiosk_unlock,
                         set_time, set_timezone, status_bar, block_uninstall, unblock_uninstall,
                         shell, install_apk,
                         set_volume, set_brightness, set_system_brightness, set_screen_timeout,
                         set_server_url]
                payload: { type: object }
      responses:
        '200': { description: '{ success, sent, offline, total, results }.' }

  /devices/{id}/command:
    post:
      tags: [devices]
      summary: Send an operational command to one screen
      description: |
        Sends reboot / shutdown / screen on/off / launch / update — and the device-owner and
        system-control commands — to a single display. The group equivalent
        (`POST /groups/{id}/command`) has existed far longer; this route did not, so commanding one
        screen was reachable only over the dashboard's websocket and not over the API at all.

        Requires scope: full (the highest scope; read and write tokens are rejected), the same as
        the group route — a fleet-affecting action is not an ordinary write.

        A panel that does not support the command is answered `400` with a `capability` field
        naming what it lacks, rather than a generic failure: "this screen cannot do that" is
        actionable and "failed" is not. The `status` in a success response says whether the panel
        actually received it or the command was queued for a device that is currently offline.
      x-required-scope: full
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  # Same list as the group route above; see the note there.
                  enum: [screen_on, screen_off, launch, update, reboot, shutdown,
                         power_menu, lock_now, kiosk_lock, kiosk_unlock,
                         set_time, set_timezone, status_bar, block_uninstall, unblock_uninstall,
                         shell, install_apk,
                         set_volume, set_brightness, set_system_brightness, set_screen_timeout,
                         set_server_url]
                payload: { type: object }
      responses:
        '200':
          description: '{ success, status, device_id }.'
        '400':
          description: |
            Unknown command type, or the panel does not support it — in which case the body carries
            `capability` naming the missing one.
        '404': { description: No such device in this workspace. }
        '503': { description: The realtime layer is not available. }

  # --------------------------------------------------------------- slide decks
  /slide-decks:
    get:
      tags: [slides]
      summary: List the slide decks in this workspace
      description: |
        A deck is the editable source document for a set of slides. Publishing one emits a playlist
        of slide widgets — so decks take no part in playback, and everything downstream
        (scheduling, groups, device assignment) works on the playlist, not on this.
      x-required-scope: read
      responses:
        '200': { description: 'An array of decks with slide counts and total duration.' }
    post:
      tags: [slides]
      summary: Create a deck
      x-required-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                doc: { $ref: '#/components/schemas/DeckDocument' }
      responses:
        '201': { description: 'The created deck, with any publish warnings.' }
        '400': { description: 'A deck needs a name.' }

  /slide-decks/{id}:
    get:
      tags: [slides]
      summary: Fetch a deck document
      x-required-scope: read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The deck, its document, and its warnings.' }
        '404': { description: 'No such deck in this workspace.' }
    put:
      tags: [slides]
      summary: Save a deck document
      description: |
        Saving is **not** publishing — nothing reaches a screen until you publish. Warnings come
        back on every save so an editor can show a problem while somebody works, rather than
        refusing the change.
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                doc: { $ref: '#/components/schemas/DeckDocument' }
      responses:
        '200': { description: 'The saved deck.' }
        '404': { description: 'No such deck in this workspace.' }
    delete:
      tags: [slides]
      summary: Delete a deck document
      description: |
        **The published playlist and its widgets are kept.** By the time a deck has been published
        what is on the wall is a playlist, possibly assigned to devices or on a schedule — deleting
        the document must not take those down with it. Pass `with_published=1` to remove them too,
        which still refuses to delete a widget another playlist is playing.
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: with_published
          in: query
          required: false
          schema: { type: string, enum: ['1', 'true'] }
          description: 'Also remove the slide widgets this deck published.'
      responses:
        '200': { description: '{ success, removed_widgets, playlist_kept }.' }
        '404': { description: 'No such deck in this workspace.' }

  /slide-decks/{id}/publish:
    post:
      tags: [slides]
      summary: Publish a deck to a playlist of slide widgets
      description: |
        Creates or updates one slide widget per page and a playlist that orders them, then publishes
        that playlist. Republishing updates the same widgets rather than making new ones, and a
        slide removed from the deck has its widget deleted — unless another playlist still plays it,
        in which case it is only unlinked.
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The deck, plus published.playlist_id, published.slides and published.removed.' }
        '404': { description: 'No such deck in this workspace.' }
        '500': { description: 'The deck could not be published.' }

  # -------------------------------------------------------------- slide fonts
  /fonts:
    get:
      tags: [slides]
      summary: List the fonts uploaded to this workspace
      description: |
        Fonts an operator uploaded, for setting slides in a brand face. The five bundled families
        are not listed here — they ship with the server and need no upload.
      x-required-scope: read
      responses:
        '200': { description: 'An array of uploaded fonts.' }
    post:
      tags: [slides]
      summary: Upload a font
      description: |
        Multipart, field name `font`. Accepts `.woff2`, `.woff`, `.ttf` and `.otf`, identified by
        magic bytes rather than by filename, up to 12 MB.

        The response `id` is what a slide stores in its element style, in the form `u:<uuid>`.

        Two things worth knowing before uploading. **This server redistributes the file**: every
        screen showing a slide in that face downloads it, from a URL that cannot be authenticated
        (the slide renders in an opaque-origin iframe carrying no credentials) — so it is
        unguessable rather than secret, the same property uploaded images already have. And
        `licence_note` is recorded against the font and shown beside it, so the question of where a
        face came from has an answer later.
      x-required-scope: write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [font]
              properties:
                font: { type: string, format: binary }
                name: { type: string, maxLength: 80 }
                licence_note: { type: string, maxLength: 300 }
      responses:
        '201': { description: 'The stored font, including the u:<uuid> a slide references it by.' }
        '400': { description: 'Not a font, a TrueType Collection, empty, or over the size limit. The message says which.' }
        '403': { description: 'No workspace context.' }

  /fonts/{id}:
    delete:
      tags: [slides]
      summary: Delete an uploaded font
      description: |
        Slides using it keep rendering — they fall back to the default bundled family, whose
        `@font-face` is emitted alongside so the fallback actually loads. Takes the raw uuid, not
        the `u:` form.
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ success: true }.' }
        '403': { description: 'That font belongs to another workspace.' }
        '404': { description: 'No such font.' }

  # ----------------------------------------------------------------- triggers
  /triggers:
    get:
      tags: [triggers]
      summary: List the triggers in this workspace
      description: |
        A trigger lets an external system interrupt a screen's playlist with different content, in
        response to an event fired at the player over the LAN — an HTTP POST or a UDP datagram. It
        is resolved entirely on the device, so it still works with the WAN down.
      x-required-scope: read
      responses:
        '200': { description: 'An array of triggers, each with its `assignments`.' }
    post:
      tags: [triggers]
      summary: Create a trigger
      description: |
        Requires scope: full. A trigger changes what a screen shows in response to a packet that is
        not itself authenticated by this API, so it is a fleet-affecting capability rather than
        ordinary content editing — the same tier as a reboot.

        The target playlist must be **published** and every item in it must be locally pinnable
        (no `remote_url`, no YouTube). Both are refused at save time rather than at fire time: a
        trigger that saves cleanly and then renders nothing during an alarm is the failure this
        feature exists to prevent.
      x-required-scope: full
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerInput' }
      responses:
        '200': { description: 'The created trigger, with its assignments.' }
        '400':
          description: |
            Validation failed — an unusable token, an unpublished or empty target playlist, an item
            that cannot be cached offline, or an assignment naming a device outside this workspace.
            The message says which.

  /triggers/{id}:
    get:
      tags: [triggers]
      summary: Fetch one trigger
      x-required-scope: read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The trigger, with its assignments.' }
        '404': { description: No such trigger in this workspace. }
    put:
      tags: [triggers]
      summary: Update a trigger
      description: 'Requires scope: full, and revalidates everything POST does.'
      x-required-scope: full
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerInput' }
      responses:
        '200': { description: The updated trigger. }
        '400': { description: Validation failed; the message says which rule. }
        '404': { description: No such trigger in this workspace. }
    delete:
      tags: [triggers]
      summary: Delete a trigger
      x-required-scope: full
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ success: true }.' }
        '404': { description: No such trigger in this workspace. }

  /devices/{id}/trigger-config:
    post:
      tags: [triggers]
      summary: Configure how one screen listens for triggers
      description: |
        Which transports a player accepts (`accept_http`, `accept_udp`), which ports it binds, and
        the multicast group it joins. Ports must be 1024-65534 — below 1024 needs root on every
        platform ScreenTinker runs on.
      x-required-scope: full
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accept_http: { type: boolean }
                accept_udp: { type: boolean }
                http_port: { type: [integer, 'null'], minimum: 1024, maximum: 65534 }
                udp_port: { type: [integer, 'null'], minimum: 1024, maximum: 65534 }
                multicast_group: { type: [string, 'null'] }
      responses:
        '200': { description: The updated trigger configuration for that device. }
        '400': { description: 'A port outside 1024-65534, or an unusable multicast group.' }
        '404': { description: No such device in this workspace. }

  /devices/{id}/trigger-secret:
    post:
      tags: [triggers]
      summary: Rotate or set the shared secret a screen requires
      description: |
        The secret an external system must present in the payload (`ST1 <secret> <token>`). The
        response says whether the panel actually received the new value rather than implying it —
        a screen that is offline when you rotate is still expecting the old one.
      x-required-scope: full
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The secret, and whether the device was reached.' }
        '404': { description: No such device in this workspace. }

  # ---------------------------------------------------------------------- pip
  /pip:
    post:
      tags: [pip]
      summary: Show a picture-in-picture overlay on a device or group
      description: |
        Pushes an image or web overlay onto a device (or every device in a group) on top
        of the running playlist, in real time (device:pip-show). The player fetches `uri`
        itself (same trust model as remote_url content; the server does not proxy it). A
        `web` overlay renders an arbitrary page in an iframe, so this requires scope: full. (#109)
      x-required-scope: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, type, uri]
              properties:
                device_id: { type: string, description: A device id OR a group id (expanded to its members). }
                type: { type: string, enum: [image, web] }
                uri: { type: string, description: Absolute http(s) URL the player fetches directly. }
                position: { type: string, enum: [top-left, top-right, bottom-left, bottom-right, center], default: top-right }
                width: { type: integer, description: 'px (40-3840)', default: 480 }
                height: { type: integer, description: 'px (40-3840)', default: 360 }
                duration: { type: integer, description: 'seconds; 0 = until cleared (0-86400)', default: 0 }
                title: { type: string }
                title_color: { type: string, description: '#RRGGBB' }
                background_color: { type: string, description: '#RRGGBB (transparency via opacity)' }
                opacity: { type: number, description: '0-1', default: 1 }
                border_radius: { type: integer, description: 'px (0-512)', default: 0 }
                close_button: { type: boolean }
      responses:
        '200': { description: '{ success, pip_id, target, sent, offline, total, results }.' }
        '400': { description: Validation error (type / uri scheme / position / numeric bounds / color). }
        '404': { description: Device or group not found in this workspace. }
    delete:
      tags: [pip]
      summary: Clear a picture-in-picture overlay
      description: 'Clears the overlay on a device or group (device:pip-clear). Requires scope: full. (#109)'
      x-required-scope: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: string, description: A device id OR a group id. }
                pip_id: { type: string, description: Omit to clear whatever overlay is showing. }
      responses:
        '200': { description: '{ success, target, sent, offline, total, results }.' }
        '404': { description: Device or group not found in this workspace. }
  /pip/clear:
    post:
      tags: [pip]
      summary: Clear a picture-in-picture overlay (alias for DELETE /pip)
      description: 'Same as DELETE /pip; provided for clients that prefer POST. Requires scope: full. (#109)'
      x-required-scope: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: string, description: A device id OR a group id. }
                pip_id: { type: string, description: Omit to clear whatever overlay is showing. }
      responses:
        '200': { description: '{ success, target, sent, offline, total, results }.' }
        '404': { description: Device or group not found in this workspace. }

