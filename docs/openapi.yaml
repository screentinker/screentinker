openapi: 3.1.0
info:
  title: ScreenTinker Public API
  version: 2.0.9
  description: |
    Public, token-scoped REST API for ScreenTinker digital signage.

    ## Authentication
    Every endpoint (except the two unauthenticated device-render endpoints) accepts a
    **scoped personal access token** presented as `Authorization: Bearer st_...`. The
    dashboard's session JWT is also accepted, but this contract targets token consumers.

    ## Scope ladder (read &#60; write &#60; full)
    Tokens carry one of three scopes; higher scopes subsume lower ones:
    - `read`  — all `GET` endpoints.
    - `write` — all resource mutations (`POST` / `PUT` / `PATCH` / `DELETE`).
    - `full`  — operational fleet commands (currently only
      `POST /groups/{id}/command`: reboot / shutdown / screen on/off).

    Each operation advertises its minimum scope via the `x-required-scope` extension
    and restates it in the operation description. A token with insufficient scope is
    rejected with `403`.

    All resources are scoped to the token's workspace; cross-workspace access is not
    available to tokens.
servers:
  - url: /api

tags:
  - name: content
    description: Media library items (uploads, remote URLs, YouTube).
  - name: folders
    description: Content folder hierarchy.
  - name: playlists
    description: Playlists and their items / per-item schedules.
  - name: assignments
    description: Device playlist items (per-device assignment helpers).
  - name: devices
    description: Registered display devices.
  - name: layouts
    description: Multi-zone screen layouts and zones.
  - name: groups
    description: Device groups and bulk operations.
  - name: schedules
    description: Time-based content scheduling.
  - name: walls
    description: Video walls (multi-device grids).
  - name: reports
    description: Proof-of-play and uptime reporting.
  - name: widgets
    description: Dynamic widgets (clock, weather, RSS, etc.) and their render output.
  - name: activity
    description: Activity log.
  - name: kiosk
    description: Interactive kiosk pages and their render output.
  - name: pip
    description: Picture-in-picture / overlay push (image or web on top of the running playlist).

security:
  - ApiToken: []
  - SessionJWT: []

components:
  securitySchemes:
    ApiToken:
      type: http
      scheme: bearer
      bearerFormat: "st_<token>"
      description: |
        Scoped personal access token. Send as `Authorization: Bearer st_...`.
        The token's scope (`read`, `write`, or `full`) gates which operations
        it may call (see the scope ladder in the API description).
    SessionJWT:
      type: http
      scheme: bearer
      description: |
        Dashboard session JWT. Also accepted on every authenticated endpoint,
        but this spec targets scoped-token consumers.

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    DeckDocument:
      type: object
      description: |
        The editable source for a deck. Each slide carries a **template** (the view: element
        geometry, style and motion, each with a `slot` name) and **fields** (the record: `{slot:
        value}`). They are joined when the slide is rendered, which is what makes it possible to
        come back and change a headline without rebuilding the layout.
      properties:
        slides:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              id:
                type: string
                description: 'Unique within the deck — it is how a republish finds the widget it already made.'
              name: { type: string, maxLength: 120 }
              dwell_sec:
                type: integer
                minimum: 1
                maximum: 3600
                default: 10
                description: |
                  How long the slide stays up. A slide's motion has to finish inside this; if it
                  does not, save and publish both return a `motion-outlives-dwell` warning naming
                  the slide. Warned rather than refused.
              widget_id:
                type: [string, 'null']
                description: 'Assigned by publish. Present so a republish updates rather than duplicates.'
              template:
                type: object
                properties:
                  background: { type: string, description: 'Hex colour. Anything else falls back to black.' }
                  elements:
                    type: array
                    maxItems: 40
                    items:
                      type: object
                      properties:
                        slot: { type: string, description: 'The key this element reads from fields.' }
                        kind: { type: string, enum: [head, body, stat, image, rule, box] }
                        box:
                          type: object
                          properties:
                            x: { type: number }
                            y: { type: number }
                            w: { type: number }
                            h: { type: number }
                        content_id: { type: [string, 'null'], description: 'For an image — a content row in this workspace.' }
                        style:
                          type: object
                          properties:
                            color: { type: string, description: 'Hex. Anything else falls back to white.' }
                            font:
                              type: string
                              description: |
                                A bundled family (`inter`, `archivo`, `oswald`, `bitter`,
                                `jetbrains-mono`), an uploaded one (`u:<uuid>`), or one of the
                                legacy generics (`sans`, `serif`, `mono`, `condensed`) which still
                                resolve.
                            size_cqw:
                              type: number
                              description: 'Relative to the screen, never pixels — so a slide scales from 720p to 4K.'
                            weight: { type: integer, minimum: 100, maximum: 900 }
                            align: { type: string, enum: [left, center, right] }
                            opacity: { type: number, minimum: 0, maximum: 1 }
                            radius_cqw: { type: number }
                        motion:
                          type: [object, 'null']
                          description: 'Null means the element is simply present from the first frame.'
                          properties:
                            animation: { type: string, enum: [fade, slideL, slideR, slideU, slideD, zoom, wipe] }
                            delay: { type: number, minimum: 0, maximum: 30 }
                            duration: { type: number, minimum: 0.05, maximum: 10 }
                            easing: { type: string, enum: [ease-out, ease-in, ease-in-out, linear, soft] }
              fields:
                type: object
                description: 'The values, keyed by slot. Editing one of these does not touch the template.'
                additionalProperties: { type: string }

    TriggerInput:
      type: object
      required: [name, match_token, target_ref, mode]
      properties:
        name: { type: string, maxLength: 200 }
        match_token:
          type: string
          description: |
            The word that fires this trigger. Printable ASCII, no spaces, 1-64 characters — the UDP
            payload is a single space-separated line (`ST1 <secret> <token>`), so a space would be
            unparseable on arrival and a newline would let one datagram look like two messages.
          pattern: '^[\x21-\x7E]{1,64}$'
        clear_token:
          type: [string, 'null']
          description: Optional word that clears an `until_cleared` trigger. Same charset.
          pattern: '^[\x21-\x7E]{1,64}$'
        source_http: { type: boolean, default: true }
        source_udp: { type: boolean, default: false }
        target_kind:
          type: string
          enum: [playlist]
          default: playlist
          description: |
            Only `playlist` is implemented. A URL target is designed and deliberately not built —
            playlist items are library content and therefore pinnable for offline use, which is the
            whole reason the target is a playlist.
        target_ref:
          type: string
          description: |
            A playlist id in this workspace. It must be published and every item must be pinnable
            offline (no `remote_url`, no YouTube), both checked when you save.
        mode:
          type: string
          enum: [once, until_cleared]
        max_duration_sec: { type: integer, minimum: 0, maximum: 86400, default: 0 }
        lease_sec:
          type: [integer, 'null']
          minimum: 5
          maximum: 86400
          description: |
            For `until_cleared` only. A dead-man's timer: the overlay retires on its own if nothing
            renews it, so a controller that dies mid-alarm cannot leave a screen stuck.
        priority: { type: integer, minimum: -1000, maximum: 1000, default: 0 }
        enabled: { type: boolean, default: true }
        assignments:
          type: array
          description: Which screens this applies to. Every target must be in the same workspace.
          items:
            type: object
            required: [target_type, target_id]
            properties:
              target_type: { type: string, enum: [device, group] }
              target_id: { type: string }
      description: |
        Note on geometry: `position`, `width`, `height`, `opacity` and `border_radius` are accepted
        and stored but are **not currently honoured** — every trigger renders fullscreen. They are
        omitted here deliberately rather than documented as working.

    Device:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        workspace_id:
          type: [string, "null"]
        playlist_id:
          type: [string, "null"]
        layout_id:
          type: [string, "null"]
          description: Assigned layout (null = fullscreen). Recently added.
        timezone:
          type: string
        orientation:
          type: string
        notes:
          type: string
        created_at:
          type: integer

        # --- Network addresses -------------------------------------------------------------
        # Two different addresses, easy to confuse, so both are spelled out. They answer
        # different questions and either can be null.
        ip_address:
          type: [string, "null"]
          description: |
            The device's **public (WAN)** address as observed by the server when the player
            connected — i.e. what the internet sees. Behind a reverse proxy this is taken from
            the first `X-Forwarded-For` entry, otherwise the socket peer address. Every device
            on one site normally shares this. Null until the device has connected at least once.
        local_ip:
          type: [string, "null"]
          description: |
            The device's **own IPv4 address on its local network** (e.g. `192.168.1.42`), as
            reported by the player itself. This is the one to use to reach a panel directly on
            site. Null on players that do not report it, where the platform withholds it, or on
            a panel with no IPv4 address at all — see `local_ip6`.
        local_ip6:
          type: [string, "null"]
          description: |
            The device's **own IPv6 address on its local network**, reported alongside
            `local_ip` rather than instead of it: a dual-stack panel has both and either may be
            the one you need. Link-local addresses (`fe80::/10`) are deliberately excluded —
            every interface has one and none can be reached without also knowing the zone
            index, so this carries a global or unique-local address or nothing. Null on players
            that do not report it and on IPv4-only panels.

        # --- Latest telemetry --------------------------------------------------------------
        # Flattened from the most recent telemetry report. All null for a device that has
        # never reported, and for platforms that cannot supply a given metric — treat every
        # field here as optional rather than assuming a web player reports what Android does.
        wifi_ssid:
          type: [string, "null"]
          description: |
            Wi-Fi network name, or null on a wired/unknown connection.

            Special value `"permission"` means the device is on Wi-Fi but the operating system
            withheld the name — on Android 10+ reading the SSID requires a location permission
            that ScreenTinker only asks for if an operator opts in. Treat `"permission"` as
            "connected, name unavailable", not as a network literally called that.
        wifi_rssi:
          type: [integer, "null"]
          description: Signal strength in dBm (negative; closer to zero is stronger).
        battery_level:
          type: [integer, "null"]
          description: Battery percentage 0-100, or null on mains-powered hardware.
        battery_charging:
          type: [integer, "null"]
          description: 1 charging, 0 not charging, null unknown.
        storage_free_mb:
          type: [integer, "null"]
        storage_total_mb:
          type: [integer, "null"]
        ram_free_mb:
          type: [integer, "null"]
        ram_total_mb:
          type: [integer, "null"]
        cpu_usage:
          type: [number, "null"]
          description: Recent CPU utilisation as a percentage, where the platform exposes it.
        uptime_seconds:
          type: [integer, "null"]
          description: Seconds since the device booted.

    Playlist:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          description: draft | published
        workspace_id:
          type: [string, "null"]
        item_count:
          type: integer
        display_count:
          type: integer

    PlaylistItem:
      type: object
      properties:
        id:
          type: integer
        playlist_id:
          type: string
        content_id:
          type: [string, "null"]
        widget_id:
          type: [string, "null"]
        zone_id:
          type: [string, "null"]
          description: Optional layout-zone placement. Recently added.
        sort_order:
          type: integer
        duration_sec:
          type: integer

    Content:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        duration_sec:
          type: [number, "null"]
        remote_url:
          type: [string, "null"]
        thumbnail_path:
          type: [string, "null"]
        folder_id:
          type: [string, "null"]
        workspace_id:
          type: [string, "null"]

    Layout:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        width:
          type: integer
        height:
          type: integer
        is_template:
          type: integer
        workspace_id:
          type: [string, "null"]
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'

    Zone:
      type: object
      properties:
        id:
          type: string
        layout_id:
          type: string
        name:
          type: string
        x_percent:
          type: number
        y_percent:
          type: number
        width_percent:
          type: number
        height_percent:
          type: number
        z_index:
          type: integer
        zone_type:
          type: string
        fit_mode:
          type: string
        background_color:
          type: string

    Widget:
      type: object
      properties:
        id:
          type: string
        widget_type:
          type: string
          description: clock | weather | rss | text | webpage | social | directory-board | directory-search
        name:
          type: string
        config:
          type: object
        workspace_id:
          type: [string, "null"]

    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          description: "#RRGGBB"
        playlist_id:
          type: [string, "null"]
        device_count:
          type: integer
        workspace_id:
          type: [string, "null"]

    Schedule:
      type: object
      properties:
        id:
          type: string
        device_id:
          type: [string, "null"]
        group_id:
          type: [string, "null"]
        zone_id:
          type: [string, "null"]
        content_id:
          type: [string, "null"]
        widget_id:
          type: [string, "null"]
        layout_id:
          type: [string, "null"]
        playlist_id:
          type: [string, "null"]
        title:
          type: string
        start_time:
          type: string
        end_time:
          type: string
        timezone:
          type: string
        recurrence:
          type: [string, "null"]
        priority:
          type: integer
        enabled:
          type: integer

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
      description: Max rows to return.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
      description: Row offset for pagination.

paths:
  # ------------------------------------------------------------------ content
  /content:
    get:
      tags: [content]
      summary: List content in the current workspace
      description: 'Requires scope: read.'
      x-required-scope: read
      parameters:
        - name: folder
          in: query
          schema: { type: string }
        - name: folder_id
          in: query
          schema: { type: string }
          description: '"root"/"" = root-level only; UUID = that folder.'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Array of content items.
    post:
      tags: [content]
      summary: Upload a content file (multipart)
      description: 'Requires scope: write.'
      x-required-scope: write
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201': { description: Created content item. }
  /content/folders:
    get:
      tags: [content]
      summary: List distinct content folder names with counts
      description: 'Requires scope: read.'
      x-required-scope: read
      responses:
        '200':
          description: 'Array of { folder, count }.'
  /content/remote:
    post:
      tags: [content]
      summary: Add a remote-URL content item
      description: 'Requires scope: write. SSRF-gated (http/https, no internal hosts).'
      x-required-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                name: { type: string }
                mime_type: { type: string }
      responses:
        '201': { description: Created content item. }
  /content/youtube:
    post:
      tags: [content]
      summary: Add a YouTube video as content
      description: 'Requires scope: write.'
      x-required-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                name: { type: string }
      responses:
        '201': { description: Created content item. }
  /content/{id}:
    get:
      tags: [content]
      summary: Get content metadata
      description: 'Requires scope: read.'
      x-required-scope: read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Content item. }
        '404': { description: Not found. }
    put:
      tags: [content]
      summary: Update content metadata
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filename: { type: string }
                mime_type: { type: string }
                remote_url: { type: string }
                folder: { type: string }
                folder_id: { type: string }
      responses:
        '200': { description: Updated content item. }
    delete:
      tags: [content]
      summary: Delete content
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ success, affectedDevices }.' }
  /content/{id}/replace:
    put:
      tags: [content]
      summary: Replace the content file (multipart)
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Updated content item. }
  /content/{id}/file:
    get:
      tags: [content]
      summary: Download the content file
      description: 'Requires scope: read.'
      x-required-scope: read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Binary file stream. }
  /content/{id}/thumbnail:
    get:
      tags: [content]
      summary: Download the content thumbnail
      description: 'Requires scope: read.'
      x-required-scope: read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Binary image stream. }

  # ------------------------------------------------------------------ folders
  /folders:
    get:
      tags: [folders]
      summary: List content folders in the current workspace
      description: 'Requires scope: read.'
      x-required-scope: read
      responses:
        '200': { description: Array of folders. }
    post:
      tags: [folders]
      summary: Create a folder
      description: 'Requires scope: write.'
      x-required-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id: { type: string }
      responses:
        '201': { description: Created folder. }
  /folders/{id}:
    put:
      tags: [folders]
      summary: Rename or move a folder
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parent_id: { type: [string, "null"] }
      responses:
        '200': { description: Updated folder. }
    delete:
      tags: [folders]
      summary: Delete a folder
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ success }.' }

  # ---------------------------------------------------------------- playlists
  /playlists:
    get:
      tags: [playlists]
      summary: List playlists in the current workspace
      description: 'Requires scope: read.'
      x-required-scope: read
      responses:
        '200': { description: Array of playlists. }
    post:
      tags: [playlists]
      summary: Create a playlist
      description: 'Requires scope: write.'
      x-required-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '201': { description: Created playlist. }
  /playlists/{id}:
    get:
      tags: [playlists]
      summary: Get a playlist with its items
      description: 'Requires scope: read.'
      x-required-scope: read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Playlist with items. }
    put:
      tags: [playlists]
      summary: Update playlist name/description
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200': { description: Updated playlist. }
    delete:
      tags: [playlists]
      summary: Delete a playlist
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ success }.' }
  /playlists/{id}/publish:
    post:
      tags: [playlists]
      summary: Publish a playlist (snapshot + push to devices)
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Published playlist with items. }
  /playlists/{id}/discard:
    post:
      tags: [playlists]
      summary: Discard draft changes (revert to published snapshot)
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Reverted playlist with items. }
  /playlists/{id}/items:
    get:
      tags: [playlists]
      summary: List a playlist's items
      description: 'Requires scope: read.'
      x-required-scope: read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Array of playlist items. }
    post:
      tags: [playlists]
      summary: Add a content or widget item to a playlist
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content_id: { type: string }
                widget_id: { type: string }
                zone_id: { type: string }
                sort_order: { type: integer }
                duration_sec:
                  type: integer
                  description: >
                    Omit to let the server choose: video content defaults to the clip's own
                    length (rounded up to a whole second), anything else to 10s.
      responses:
        '201': { description: Created playlist item. }
  /playlists/{id}/items/bulk:
    post:
      tags: [playlists]
      summary: Add many content items to a playlist in one request
      description: >-
        Content only; widgets and child playlists are added one at a time via
        /playlists/{id}/items. Items that cannot be added (missing, expired,
        deactivated, or in another workspace) are reported in `skipped` rather
        than failing the whole batch. Requires scope: write.
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_ids]
              properties:
