  # ------------------------------------------------------------------ widgets
  /widgets:
    get:
      tags: [widgets]
      summary: List widgets in the current workspace
      description: 'Requires scope: read.'
      x-required-scope: read
      responses:
        '200':
          description: Array of widgets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Widget' }
    post:
      tags: [widgets]
      summary: Create a widget
      description: 'Requires scope: write.'
      x-required-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [widget_type, name]
              properties:
                widget_type: { type: string }
                name: { type: string }
                config: { type: object }
      responses:
        '201':
          description: Created widget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
  /widgets/preview:
    post:
      tags: [widgets]
      summary: Render an unsaved widget config to HTML (non-persisting)
      description: 'Requires scope: write (any POST needs write under the scope ladder); renders to HTML without persisting anything.'
      x-required-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [widget_type]
              properties:
                widget_type: { type: string }
                config: { type: object }
      responses:
        '200':
          description: Rendered widget HTML.
          content:
            text/html:
              schema: { type: string }
  /widgets/{id}:
    get:
      tags: [widgets]
      summary: Get a widget
      description: 'Requires scope: read.'
      x-required-scope: read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Widget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
    put:
      tags: [widgets]
      summary: Update a widget
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                config: { type: object }
      responses:
        '200': { description: Updated widget. }
    delete:
      tags: [widgets]
      summary: Delete a widget
      description: 'Requires scope: write.'
      x-required-scope: write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ success }.' }
  /widgets/{id}/render:
    get:
      tags: [widgets]
      summary: Render a widget as an HTML page (public)
      description: |
        Unauthenticated device-render endpoint. Players fetch this HTML directly,
        so no token or scope is required.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rendered widget HTML.
          content:
            text/html:
              schema: { type: string }

