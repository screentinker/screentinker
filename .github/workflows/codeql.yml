name: CodeQL

# Static analysis of the JavaScript (OpenSSF Scorecard: SAST). Findings appear under Security ->
# Code scanning; this workflow does not fail a PR on its own.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the results to code scanning
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          # Vendored third-party bundles and tooling output are not our code.
          #
          # The test suites are not shipped and never receive a request from outside the test
          # process. They were 92 of the open alerts, and every one was a test doing what tests do:
          # regex-matching rendered HTML (bad-tag-filter), building fixture URLs by substring, or
          # standing up throwaway Express routes with no limiter. None of that reaches a deployment,
          # and leaving it in made the list too noisy to notice a real finding in shipped code.
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - frontend/vendor/**
              - marketing/**
              - '**/*.min.js'
              - server/test/**
              - native/tests/**
              - roku/tests/**
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
