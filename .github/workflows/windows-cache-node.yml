name: Windows cache node

# Builds the studio cache-node installer (server/packaging/windows) on real Windows and proves it
# end to end: a primary runs from this checkout, mints an invite, the installer is run SILENTLY with
# it, and the installed service must join (dialling out), copy the workspace, survive a restart and
# uninstall cleanly. Only runs when the package or the dial-out path changes, or by hand.
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/packaging/windows/**'
      - 'server/lib/mesh/dial-out.js'
      - 'server/services/mesh-dialer.js'
      - 'server/ws/meshDialIn.js'
      - '.github/workflows/windows-cache-node.yml'
  push:
    branches: [main]
    paths:
      - 'server/packaging/windows/**'
      - 'server/lib/mesh/dial-out.js'
      - 'server/services/mesh-dialer.js'
      - 'server/ws/meshDialIn.js'
      - '.github/workflows/windows-cache-node.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cache-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-install:
    name: Build, install, join, uninstall
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      JWT: ci-shared-secret-0123456789abcdef0123456789abcdef
      PRIMARY_PORT: '3200'
      NODE_PORT: '3201'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        shell: pwsh
        run: server\packaging\windows\build.ps1

      - name: Start a primary from this checkout
        shell: pwsh
        run: |
          Push-Location server; npm ci --no-audit --no-fund; Pop-Location
          $env:PORT = $env:PRIMARY_PORT; $env:MESH_ALLOW_UPLINK = 'true'; $env:JWT_SECRET = $env:JWT
          $env:DATA_DIR = "$env:RUNNER_TEMP\primary"; $env:NODE_ENV = 'test'
          Start-Process -FilePath node -ArgumentList 'server.js' -WorkingDirectory server `
            -RedirectStandardOutput "$env:RUNNER_TEMP\primary.log" -RedirectStandardError "$env:RUNNER_TEMP\primary.err.log"
          $base = "http://127.0.0.1:$env:PRIMARY_PORT"
          for ($i = 0; $i -lt 120; $i++) { try { Invoke-RestMethod "$base/api/status" | Out-Null; break } catch { Start-Sleep 1 } }
          $reg = Invoke-RestMethod "$base/api/auth/register" -Method Post -ContentType 'application/json' -Body (@{ email = 'admin@primary.local'; password = 'Passw0rd123' } | ConvertTo-Json)
          $h = @{ Authorization = "Bearer $($reg.token)" }
          $me = Invoke-RestMethod "$base/api/auth/me" -Headers $h
          Invoke-RestMethod "$base/api/devices/web-player" -Method Post -Headers ($h + @{ 'x-workspace-id' = $me.current_workspace_id }) -ContentType 'application/json' -Body '{"name":"Studio TV"}' | Out-Null
          $inv = Invoke-RestMethod "$base/api/mesh/uplink/invite" -Method Post -Headers $h -ContentType 'application/json' -Body (@{ workspaceIds = @($me.current_workspace_id) } | ConvertTo-Json)
          "INVITE=$($inv.code)" | Out-File -Append $env:GITHUB_ENV

      - name: Install silently with the invite
        shell: pwsh
        run: |
          $exe = Get-ChildItem server\packaging\windows\dist\ScreenTinker-CacheNode-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/LOG=$env:RUNNER_TEMP\install.log", "/PRIMARY_URL=http://127.0.0.1:$env:PRIMARY_PORT", "/JOIN_CODE=$env:INVITE",
            "/JWT_SECRET=$env:JWT", '/CACHE_GB=2', "/PORT=$env:NODE_PORT")
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          (Get-Service ScreenTinkerCacheNode).Status

      - name: The node joins by dialling out and copies the workspace
        shell: pwsh
        run: |
          $base = "http://127.0.0.1:$env:NODE_PORT"
          function Wait-Joined {
            for ($i = 0; $i -lt 180; $i++) {
              try {
                $s = Invoke-RestMethod "$base/api/status"
                $r = $s.scale_out.replica_of | Select-Object -First 1
                if ($r -and $r.dial.connected -and $r.workspaces -gt 0 -and $r.phase -ne 'snapshot') { return $r }
              } catch { }
              Start-Sleep 1
            }
            throw 'the cache node did not join and copy within 3 minutes'
          }
          $r = Wait-Joined
          $r | ConvertTo-Json -Depth 5
          if (-not $r.cache) { throw 'caches-content was not taken on' }
          if ((Invoke-WebRequest "$base/cache-node.html" -UseBasicParsing).StatusCode -ne 200) { throw 'status page missing' }
          if ((Invoke-WebRequest "$base/js/cache-node-status.js" -UseBasicParsing).StatusCode -ne 200) { throw 'status script missing' }
          # The settings file holds JWT_SECRET: no access for ordinary users.
          $acl = (Get-Acl "$env:ProgramData\ScreenTinker\screentinker.env").Access | ForEach-Object { $_.IdentityReference.Value }
          if ($acl -match 'Users') { throw "settings file is readable by users: $($acl -join ', ')" }
          # A restart (graceful stop, then start) comes back joined, from the stored edge.
          Restart-Service ScreenTinkerCacheNode
          $r = Wait-Joined
          "rejoined after restart: dial.connected=$($r.dial.connected)"

      - name: Uninstall
        shell: pwsh
        run: |
          $u = "$env:ProgramFiles\ScreenTinker Cache Node\unins000.exe"
          $p = Start-Process $u -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "uninstaller exit $($p.ExitCode)" }
          Start-Sleep 3
          if (Get-Service ScreenTinkerCacheNode -ErrorAction SilentlyContinue) { throw 'service still registered after uninstall' }

      - name: Logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item "$env:RUNNER_TEMP\*.log" logs -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramData\ScreenTinker\logs\*" logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cache-node-logs
          path: logs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-node-installer
          path: server/packaging/windows/dist/*.exe
