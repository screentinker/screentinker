<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>API Reference — ScreenTinker Digital Signage API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="The ScreenTinker REST API: manage displays, playlists, content, schedules and groups with scoped tokens. Rendered from the OpenAPI spec this instance serves."/>
  <!-- This page is advertised in sitemap.xml, so it needs what a crawler needs. It had a
       three-word description and no canonical: an API reference is one of the pages developers
       actually search for, and without a canonical every instance serving it competes with
       screentinker.com for the same content. -->
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://screentinker.com/api-docs.html"/>
  <link rel="alternate" type="text/markdown" href="https://screentinker.com/api-docs.md">
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://screentinker.com/api-docs.html"/>
  <meta property="og:title" content="ScreenTinker Digital Signage API Reference"/>
  <meta property="og:description" content="Manage displays, playlists, content, schedules and groups over REST with scoped tokens."/>
  <meta property="og:image" content="https://screentinker.com/assets/dashboard-preview.png"/>
  <meta property="og:site_name" content="ScreenTinker"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="ScreenTinker Digital Signage API Reference"/>
  <meta name="twitter:description" content="Manage displays, playlists, content, schedules and groups over REST with scoped tokens."/>
  <meta name="twitter:image" content="https://screentinker.com/assets/dashboard-preview.png"/>
  <meta name="theme-color" content="#111827"/>
  <link rel="icon" href="/assets/icon-192.png"/>
  <style>body { margin: 0; padding: 0; }</style>
</head>
<body>
  <!-- Self-hosted Redoc: the spec is served at /openapi.yaml and the Redoc bundle is
       vendored locally (no CDN) so the docs work on an offline/air-gapped instance.
       The <redoc> element auto-initialises from the standalone bundle. -->
  <redoc spec-url="/openapi.yaml"></redoc>
  <script src="/vendor/redoc.standalone.js"></script>
</body>
</html>
