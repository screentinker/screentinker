# Include this file once inside Nginx's http {} block. Replace the hostname and
# certificate paths. You need an existing TLS certificate; this example does not
# request one or redirect HTTP traffic on port 80.
# This example accepts public traffic directly, without a CDN or tunnel.
# For Cloudflare Tunnel, make both changes marked TUNNEL below.
# It does not configure visitor IP restoration for Cloudflare's public proxy.
# Keep port 3001 private. This upstream requires the app to serve HTTP on 3001.
# With app TLS, 3001 redirects to HTTPS (default 3443); configure the upstream accordingly.
# Setup and verification: docs/operations.md#nginx-and-caddy
# Real IP reference: https://nginx.org/en/docs/http/ngx_http_realip_module.html
map $http_upgrade $screentinker_connection {
    default upgrade;
    '' close;
}

server {
    # TUNNEL 1: replace the listen/ssl lines below with the commented lines.
    # This listens on loopback for local cloudflared. Requires Nginx's realip module.
    # Point cloudflared at http://127.0.0.1:8080, with Host = signage.example.com.
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/signage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signage.example.com/privkey.pem;
    # listen 127.0.0.1:8080;
    # set_real_ip_from 127.0.0.1;
    # real_ip_header CF-Connecting-IP;
    # real_ip_recursive off;

    server_name signage.example.com;
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set the forwarded host here instead of trusting the incoming header.
        proxy_set_header X-Forwarded-Host $host;
        # The connecting client's IP, or the visitor's IP restored by realip for Tunnel.
        proxy_set_header X-Forwarded-For $remote_addr;
        # TUNNEL 2: replace $scheme with https, since visitors use HTTPS at Cloudflare.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $screentinker_connection;
        proxy_read_timeout 300s;
    }
}
