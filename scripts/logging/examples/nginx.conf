# Include ONCE in nginx's http {} context. Replace hostname/certificate paths.
# Default: public clients connect directly; no CDN/tunnel in front.
# For Cloudflare Tunnel, apply BOTH changes marked TUNNEL below.
# Keep the app's port 3001 private. Use HTTPS upstream instead if app TLS is enabled.
# Public mode needs an existing TLS certificate; this example does not configure
# certificate issuance or an HTTP port-80 redirect.
map $http_upgrade $screentinker_connection {
    default upgrade;
    '' close;
}

server {
    # TUNNEL 1: replace these listen/ssl lines with the commented directives.
    # Only local cloudflared may reach the tunnel listener. Requires realip module.
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/signage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signage.example.com/privkey.pem;
    # listen 127.0.0.1:8080;
    # set_real_ip_from 127.0.0.1;
    # real_ip_header CF-Connecting-IP;
    # real_ip_recursive off;

    server_name signage.example.com;
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Express trusts this proxy; do not pass a client-supplied forwarded host.
        proxy_set_header X-Forwarded-Host $host;
        # Public mode: TCP client. Tunnel mode: realip restores the visitor here.
        proxy_set_header X-Forwarded-For $remote_addr;
        # TUNNEL 2: replace $scheme with https (the public scheme at Cloudflare).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $screentinker_connection;
        proxy_read_timeout 300s;
    }
}
