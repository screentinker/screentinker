# Install as /etc/fail2ban/action.d/screentinker-cloudflare.conf.
# Requires Fail2ban's cloudflare.conf action with _cf_api_url and _cf_api_prms support.
# Token permission: Zone -> Firewall Services -> Edit, scoped to the target zone.
# Setup, references and ban/unban checks: docs/operations.md#cloudflare-action
[INCLUDES]
before = cloudflare.conf

[Definition]
_cf_api_url = https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules
_cf_api_prms = -H 'Authorization: Bearer <cftoken>' -H 'Content-Type: application/json'

[Init]
# Set cfzone and cftoken in /etc/fail2ban/action.d/screentinker-cloudflare.local
# under [Init]. Make that file root-owned with mode 0600 to protect the token.
# cftoken is the token secret only, without quotes or a Bearer prefix.
cfzone = REPLACE_WITH_ZONE_ID
cftoken = REPLACE_WITH_ZONE_API_TOKEN
