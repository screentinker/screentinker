# Install as /etc/fail2ban/action.d/screentinker-cloudflare.conf.
# Reuse the distro action, changing its endpoint and authentication to a zone API token.
# Requires the upstream-compatible cloudflare.conf action (see docs/operations.md#fail2ban-examples-nginx-caddy-and-cloudflare-tunnel).
[INCLUDES]
before = cloudflare.conf

[Definition]
_cf_api_url = https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules
_cf_api_prms = -H 'Authorization: Bearer <cftoken>' -H 'Content-Type: application/json'

[Init]
# Put real values in root-owned screentinker-cloudflare.local, not in this repo.
cfzone = REPLACE_WITH_ZONE_ID
cftoken = REPLACE_WITH_ZONE_API_TOKEN
