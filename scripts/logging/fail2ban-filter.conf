# Install as /etc/fail2ban/filter.d/screentinker.conf.
# Match the app's auth_failure lines. HTTP 401/429 responses and console messages do not count.
[Definition]
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S\.%%f%%z
failregex = ^\s*\[security\] auth_failure ip=<ADDR> method=(?:password|totp)$
ignoreregex =
