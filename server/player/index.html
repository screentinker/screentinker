             * deliberately BEFORE it disturbs the live overlay. Without this, the current trigger
             * is left both active AND on the held list — so clearing it fires it straight back,
             * and an operator watches the alarm they just cleared reappear on its own.
             */
            if (!triggerFire(incoming, source) && heldEntry) {
              const i = triggerHeld.indexOf(heldEntry);
              if (i >= 0) triggerHeld.splice(i, 1);
            }
          }
        }
      }
      return verdict;
    }

    /*
     * HTTP transport.
     *
     * ⚠️ PROBED BY TRYING, NEVER INFERRED FROM THE PLATFORM. A browser tab cannot bind a port at
     * all; a node-enabled BrightSign widget can. Requiring http and actually listening either works
     * or it does not, and the capability is declared only on success — the same rule as
     * declaredCapabilities() ("a capability we cannot verify is left out") and the same lesson as
     * read-runner.js detecting worker_threads by construction rather than by version sniffing.
     *
     * ⚠️ OFF BY DEFAULT. This opens a listening port on the LAN that changes what a screen shows.
     */
    let triggerHttpServer = null;
    /*
     * ⚠️ BE LIBERAL ABOUT FRAMING — the control-system world is not consistent about it and does
     * not consider that a bug. Crestron's own worked example emits HTTP/1.0 with BARE LF, not CRLF.
     * Q-SYS ships an EOL constant literally called `Any` ("any sequence of carriage return and/or
     * linefeed characters") plus a `Null` (single 0 byte) mode — the existence of `Any` is the AV
     * industry telling you line endings arrive however they arrive. AMX appends $0D,$0A by hand,
     * per site, and sometimes forgets.
     *
     * We also TRIM, and this comment is the documentation of that: BrightSign does not trim, its
     * docs say "leading/trailing spaces do matter", and it is a recurring support burden. A
     * trailing space must never be the reason an evacuation notice does not appear.
     *
     * The 1024 cap is Extron's, not ours: ControlScript truncates UDP payloads at 1024 bytes and
     * delivers at most 1024 per receive event. Anything longer is not a message we could have been
     * sent intact, so refusing to consider the tail is honest rather than lossy.
     */
    function wireClean(s) {
      let t = String(s == null ? '' : s);
      if (t.length > 1024) t = t.slice(0, 1024);
      /*
       * ⚠️ ONE COMBINED CLASS, not strip-then-trim. The previous version stripped a trailing run of
       * terminators and THEN trimmed, so any whitespace AFTER a NUL/CR/LF defeated the whole
       * cleanup: "TOKEN\r\n\0  " survived as "TOKEN\r\n\0" and was rejected as malformed. That is
       * precisely the documented target — Q-SYS's Null EOL mode plus AMX's hand-appended padding —
       * and the old test loop only ever tried one suffix at a time, so it could not see it.
       * \u0000 is not whitespace to trim(), which is why it has to be named explicitly.
       * Leading junk is stripped too: a UTF-8 BOM from a .NET sender is otherwise a bad_magic.
       */
      return t.replace(/^[\s\0\uFEFF]+/, '').replace(/[\s\0\uFEFF]+$/, '');
    }

    /** Minimal query parser — no `url` module, which is not present on every player platform. */
    function parseQuery(u) {
      const out = {};
      const i = String(u || '').indexOf('?');
      if (i < 0) return out;
      for (const pair of String(u).slice(i + 1).split('&')) {
        if (!pair) continue;
        const eq = pair.indexOf('=');
        const k = eq < 0 ? pair : pair.slice(0, eq);
        const v = eq < 0 ? '' : pair.slice(eq + 1);
        try {
          out[decodeURIComponent(k.replace(/\+/g, ' '))] = decodeURIComponent(v.replace(/\+/g, ' '));
        } catch (e) { out[k] = v; }   // a bad %-escape must not lose the whole request
      }
      return out;
    }

    function startTriggerHttp() {
      if (!triggerConfig.accept_http) return;
      /*
       * ⚠️ IDEMPOTENT. This is called at boot AND whenever the config changes, so without a guard
       * the second call races the first: it binds the same port, gets EADDRINUSE, and its error
       * handler marks the listener DOWN — while the original is up and serving. Found by firing at
       * it: `listeners.http` read false with a working listener behind it, which would have hidden
       * the capability and made the one diagnostic an installer trusts say the opposite of the truth.
       */
      if (triggerHttpServer) return;
      let http;
      try { http = require('http'); } catch (e) {
        triggerLog('info', 'no raw HTTP on this platform — trigger HTTP listener not started');
        return;
      }
      const port = Number(triggerConfig.http_port) || 8079;
      try {
        const srv = http.createServer((req, res) => {
          const ip = (req.socket && req.socket.remoteAddress) || 'unknown';
          /*
           * ⚠️ The reply is newline-terminated on purpose. Extron integrators confirm delivery with
           * SendAndWait(data, timeout, deliTag=...), i.e. they read until a known suffix; a body with
           * no terminator leaves them blocking until timeout on a request that actually succeeded.
           * Cheap here, and it turns fire-and-hope into something an integrator can alarm on.
           */
          const reply = (v, statusOverride) => {
            const b = JSON.stringify(v.ok ? { ok: true, action: v.action } : { ok: false, error: v.reason }) + '\n';
            // typeof-guarded: this region is compiled in isolation by three tests, whose env has no Buffer.
            const len = (typeof Buffer !== 'undefined' && Buffer.byteLength) ? Buffer.byteLength(b) : b.length;
            /*
             * ⚠️ no-store is not hygiene here. A GET that changes what is on a screen is a
             * non-idempotent "safe" method: any prefetcher, link scanner, AV URL-follower or
             * intermediate cache that sees the URL can replay the fire. Caching is the one part
             * of that we can refuse, and the URL should be treated as a bearer credential.
             */
            res.writeHead(statusOverride || (v.ok ? 200 : 400), {
              'Content-Type': 'application/json',
              'Content-Length': len,
              'Cache-Control': 'no-store, no-cache, must-revalidate',
              'Pragma': 'no-cache',
            });
            res.end(b);
          };
          const fire = (text) => reply(handleTrigger({ text: wireClean(text), source: 'http', sourceIp: ip }));

          /*
           * ⚠️ GET IS NOT A CONVENIENCE — it is the only HTTP an AMX or Extron installer can reach.
           * AMX NetLinx has no HTTP client and no TLS at all: every request is hand-concatenated
           * strings with a manually computed Content-Length, and its own community's advice is to
           * "start with a full-blown header, then take stuff out one at a time until it breaks".
           * Extron's Global Scripter forbids the http, socket and ssl modules outright (so urllib is
           * gone too) while still allowing json/hmac/hashlib. A POST-JSON-only door is unreachable
           * from both. A GET with query parameters is the second-easiest thing to emit on every
           * control platform surveyed, after a bare UDP string.
           *
           * The secret rides in the query string for the same reason Carousel's CAP endpoint takes
           * its token there: plenty of this gear cannot set a request header at all.
           */
          if (req.method === 'GET') {
            const q = parseQuery(req.url);
            // `m` carries a whole raw wire line, for senders that already build one.
            if (q.m) return fire(q.m);
            if (q.token) return fire('ST1 ' + (q.secret || '') + ' ' + q.token);
            /*
             * ⚠️ ROUTED THROUGH handleTrigger, not short-circuited. A branch that replies without
             * it is an UNMETERED door that moves no counters — so an installer who typed ?tok=
             * instead of ?token= watches `received` sit at 0 and concludes their request never
             * reached the player. That is the exact misreading these counters exist to prevent,
             * and it also left one door outside the rate limiter.
             */
            // 'ST1' alone parses as OURS but incomplete -> reason `malformed`, which is a member of
            // the closed reject set and is diagnostically distinct from `bad_magic` (stray LAN
            // broadcast noise). A mistyped ?tok= should not land in the same bucket as a printer
            // announcing itself.
            return fire('ST1');
          }
          if (req.method !== 'POST') {
            // Through reply(), so it carries the newline an Extron SendAndWait(deliTag=) reads
            // until. A bodiless 405 blocks that sender to timeout — the very failure the
            // termination work exists to prevent, on the one path nobody was testing.
            res.setHeader('Allow', 'GET, POST');
            return reply({ ok: false, reason: 'GET or POST only' }, 405);
          }
          let body = '';
          req.on('data', (c) => {
            body += c;
            // Bound the read: an endless body must not become memory pressure on a player.
            if (body.length > 4096) { req.destroy(); }
          });
          req.on('end', () => {
            let text = body;
            // Accept the raw line OR a JSON envelope, because some gear can only POST a string and
            // some can only POST JSON. Same wire format underneath either way.
            try {
              const j = JSON.parse(body);
              if (j && typeof j === 'object' && j.token) {
                text = 'ST1 ' + (j.secret || '') + ' ' + j.token;
              }
            } catch (e) { /* not JSON: it is the raw line */ }
            // A form post is the third shape this gear produces, and it costs one branch.
            if (/^[^=&\s]+=[^&]*(&|$)/.test(body) && /(^|&)token=/.test(body)) {
              const q = parseQuery('?' + body);
              if (q.token) text = 'ST1 ' + (q.secret || '') + ' ' + q.token;
            }
            fire(text);
          });
        });
        srv.on('error', (e) => {
          triggerLog('warn', 'trigger HTTP listener failed: ' + ((e && e.message) || e));
          // Only report DOWN if this attempt was the one holding the port. A failed duplicate must
          // not overwrite the state of a listener that is working.
          if (triggerHttpServer === srv) { triggerHttpServer = null; triggerStats.listeners.http = false; }
        });
        triggerHttpServer = srv;
        srv.listen(port, () => {
          triggerStats.listeners.http = port;
          triggerLog('info', 'HTTP trigger listener on :' + port);
        });
      } catch (e) {
        triggerLog('info', 'could not start the trigger HTTP listener: ' + ((e && e.message) || e));
      }
    }

    /*
     * UDP transport — ONE socket, three addressing modes.
     *
     * ⚠️ Unicast, subnet broadcast and multicast are NOT three code paths. A single udp4 socket
     * bound to 0.0.0.0 receives unicast and broadcast inherently; multicast is the same socket plus
     * an addMembership call. Splitting them would mean three places to fix the next parsing bug and
     * three chances for them to disagree about what a valid payload is.
     *
     * ⚠️ OFF BY DEFAULT, and separately from HTTP. One datagram to a multicast group or a subnet
     * broadcast reaches EVERY player on the LAN at once — a categorically larger blast radius than
     * a unicast POST at one host, which is why the two flags are independent.
     */
    let triggerUdpSocket = null;
    let triggerUdpIface = null;
    let triggerRejoinTimer = null;

    /*
     * ⚠️ DROP THEN ADD, NOT ADD AGAIN. This is the whole reason the periodic rejoin works.
     *
     * The field failure this defends against is a switch doing IGMP snooping that stops forwarding
     * the group because it missed a membership report. Nothing on the host looks wrong: the socket
     * is bound, the membership is still held locally, and datagrams simply stop arriving.
     *
     * Calling addMembership() again on a group you are already in returns EADDRINUSE and emits NO
     * fresh report — so the obvious "re-add every 90s" would be a no-op against the exact failure it
     * was written for. Dropping first and re-adding forces a real IGMP report onto the wire.
     *
     * The cost is a sub-millisecond window where this host is not a member. A datagram arriving in
     * that window is lost; the alternative is losing every datagram, permanently, with nothing in
     * any log. That trade is why it is here and not a comment saying "TODO: verify".
     */
    function triggerJoinGroup(sock, group, why) {
      let os;
      try { os = require('os'); } catch (e) { os = null; }
      const iface = (os && window.TriggerResolve)
        ? window.TriggerResolve.pickMulticastInterface(os.networkInterfaces())
        : null;
      const m = triggerStats.multicast || (triggerStats.multicast = { rejoin_count: 0 });

      try { sock.dropMembership(group, triggerUdpIface || iface || undefined); }
      catch (e) { /* not a member yet, or the old interface is gone — both fine */ }

      try {
        sock.addMembership(group, iface || undefined);
        triggerUdpIface = iface;
        m.group = group; m.iface = iface; m.joined_at = Date.now(); m.last_join_error = null;
        if (why === 'rejoin') m.rejoin_count = (m.rejoin_count || 0) + 1;
        triggerLog('info', `joined ${group} on ${iface || '(default iface)'} (${why})`, 'join-' + why);
      } catch (e) {
        m.last_join_error = (e && e.message) || String(e);
        triggerLog('warn', `could not join ${group}: ${m.last_join_error}`, 'join-fail');
      }
    }

    function startTriggerUdp() {
      if (!triggerConfig.accept_udp) return;
      if (triggerUdpSocket) return;              // idempotent, same lesson as the HTTP listener
      let dgram;
      try { dgram = require('dgram'); } catch (e) {
        triggerLog('info', 'no raw sockets on this platform — UDP triggers unavailable');
        return;
      }
      const port = Number(triggerConfig.udp_port) || 7847;
      const group = triggerConfig.multicast_group || '239.255.42.1';
      try {
        // reuseAddr so several listeners on one host (and a restart that has not released the port
        // yet) do not lock each other out.
        const sock = dgram.createSocket({ type: 'udp4', reuseAddr: true });

        sock.on('message', (buf, rinfo) => {
          const text = buf.toString('utf8');
          // The self-test's own datagram: answered here and NOT passed on, so it never fires a
          // trigger and never moves the counters it exists to explain.
          if (text.slice(0, TRIGGER_PROBE.length) === TRIGGER_PROBE) {
            if (triggerProbeNonce && text.slice(TRIGGER_PROBE.length) === triggerProbeNonce) {
              triggerProbeNonce = null;
              triggerStats.multicast = triggerStats.multicast || {};
              triggerStats.multicast.loopback = 'ok';
              triggerStats.multicast.loopback_at = Date.now();
              triggerLog('info', 'self-test OK — this player receives its own multicast group');
              reportTriggerStatus();
            }
            return;
          }
          // Same liberal framing as the HTTP door — see wireClean. A datagram from a control
          // processor may or may not carry a terminator, and its author does not consider that
          // a detail worth being consistent about.
          handleTrigger({ text: wireClean(text), source: 'udp', sourceIp: (rinfo && rinfo.address) || 'unknown' });
        });
        sock.on('error', (e) => {
          triggerLog('warn', 'UDP trigger socket error: ' + ((e && e.message) || e));
          if (triggerUdpSocket === sock) {
            triggerUdpSocket = null;
            triggerStats.listeners.udp = false;
            try { if (triggerRejoinTimer) clearInterval(triggerRejoinTimer); } catch (e2) {}
            triggerRejoinTimer = null;
          }
        });

        triggerUdpSocket = sock;
        sock.bind(port, '0.0.0.0', () => {
          try { sock.setBroadcast(true); } catch (e) { /* not fatal: unicast + multicast still work */ }
          // ⚠️ TTL 1: a trigger is a local-site event. Letting it cross a router is a way to change
          // screens in a building nobody meant to address.
          try { sock.setMulticastTTL(1); } catch (e) { /* older stacks */ }
          triggerStats.listeners.udp = port;
          triggerJoinGroup(sock, group, 'bind');
          // Immediately, so the answer is on the diagnostics page before anyone asks.
          setTimeout(() => triggerSelfTest(sock, group, port), 500);

          /*
           * Two rejoin mechanisms, because they cover different failures:
           *   - the TIMER is the backstop for silent snooping loss, which no host-side signal
           *     reports at all;
           *   - the INTERFACE WATCH is the fast path for DHCP renewal, link flap and wake, where
           *     the address genuinely moved and the old membership is on an interface that is gone.
           */
          triggerRejoinTimer = setInterval(() => {
            let os; try { os = require('os'); } catch (e) { return; }
            const now = window.TriggerResolve
              ? window.TriggerResolve.pickMulticastInterface(os.networkInterfaces()) : null;
            triggerJoinGroup(sock, group, now !== triggerUdpIface ? 'iface-changed' : 'rejoin');
          }, 90000);
          if (triggerRejoinTimer && triggerRejoinTimer.unref) triggerRejoinTimer.unref();

          triggerLog('info', `UDP trigger listener on :${port} (unicast + broadcast + ${group})`);
        });
      } catch (e) {
        triggerLog('info', 'could not start the UDP trigger listener: ' + ((e && e.message) || e));
        triggerUdpSocket = null;
      }
    }

    /*
     * ⚠️ THE LOOPBACK SELF-TEST — the one diagnostic that needs nobody else's equipment.
     *
     * "No trigger arrived" has two completely different causes and one symptom. Either the
     * integrator's panel never sent anything, or multicast is not reaching this player — and those
     * are different site visits, different people and different afternoons. Counters distinguish
     * them only once SOMETHING has been sent. This answers it with nothing sent at all: the player
     * addresses its own group and reports whether it heard itself.
     *
     * ⚠️ The probe is recognised BEFORE the handler, so it never fires a trigger and never touches
     * the accept/reject counters. Polluting the numbers an installer is reading, in order to
     * produce a number for an installer to read, would be self-defeating.
     */
    let triggerProbeNonce = null;
    let triggerProbeTimer = null;
    const TRIGGER_PROBE = 'ST1-PROBE ';

    function triggerSelfTest(sock, group, port) {
      if (!sock) return;
      try {
        const nonce = String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8);
        triggerProbeNonce = nonce;
        triggerStats.multicast = triggerStats.multicast || {};
        triggerStats.multicast.loopback = 'testing';
        sock.send(Buffer.from(TRIGGER_PROBE + nonce), port, group, (err) => {
          if (err) {
            triggerStats.multicast.loopback = 'send-failed';
            triggerLog('warn', 'self-test could not send: ' + ((err && err.message) || err));
          }
        });
        try { if (triggerProbeTimer) clearTimeout(triggerProbeTimer); } catch (e) {}
        triggerProbeTimer = setTimeout(() => {
          if (triggerProbeNonce === nonce) {
            triggerStats.multicast.loopback = 'fail';
            /*
             * ⚠️ Worth saying loudly, because it is actionable and specific: the socket is bound and
             * the membership is held, and the group still is not coming back. That is the network
             * between here and the switch, not the configuration on this box.
             */
            triggerLog('warn', `self-test FAILED — ${group} does not reach this player ` +
                               '(socket bound, membership held; suspect IGMP snooping or the switch)');
            triggerProbeNonce = null;
          }
        }, 2000);
      } catch (e) {
        triggerStats.multicast.loopback = 'error';
      }
    }

    /*
     * Everything an installer needs, in one object, reported as CURRENT STATE.
     *
     * ⚠️ `last_datagram_at` counts REJECTED traffic too, and that is the whole point of the surface:
     * a recent timestamp with zero accepts means packets ARE arriving and the token or secret is
     * wrong; a null timestamp means nothing is arriving and it is the network. Two different
     * problems that look identical from the dashboard without this distinction.
     */
    function triggerStatusPayload() {
      const a = triggerActive;
      return {
        listeners: triggerStats.listeners,
        multicast: triggerStats.multicast || null,
        received: triggerStats.received,
        accepted: triggerStats.accepted,
        rejected: triggerStats.rejected,
        last_datagram_at: triggerStats.last_datagram_at,
        definitions: Array.isArray(triggers) ? triggers.length : 0,
        held: triggerHeld.length,
        active: a ? {
          trigger_id: a.trigger.id, name: a.trigger.name, mode: a.mode,
          since: a.since, source: a.source, lease_until: a.leaseUntil || null,
        } : null,
      };
    }

    function reportTriggerStatus() {
      try {
        if (!socket?.connected || !config.deviceId) return;
        socket.emit('device:trigger-status', {
          device_id: config.deviceId, status: triggerStatusPayload(),
        });
      } catch (e) { /* diagnostics must never break playback */ }
    }

    /*
     * ⚠️ BOOT FROM THE CACHE, before the socket connects. A site whose WAN is down comes up with
     * exactly what it had: definitions, pinned media, and a listener. Waiting for a sync would mean
     * triggers only work once the internet does, which is the opposite of the requirement.
     */
    try { startTriggerHttp(); } catch (e) { /* never let a listener break playback */ }
    try { startTriggerUdp(); } catch (e) { /* ditto */ }
    /*
     * ⚠️ A SLOW HEARTBEAT AS WELL AS ON-CHANGE, because the most valuable reading is the one where
     * NOTHING changed: an installer watching `received` stay at zero while they press the button is
     * reading the answer. Reporting only on state change would leave that screen blank for exactly
     * the person who needs it, and only fill in once something already worked.
     */
    (function () {
      const t = setInterval(reportTriggerStatus, 60000);
      if (t && t.unref) t.unref();
    })();

    // ==================== PiP overlay (#109) ====================
    // Single overlay slot, last-show-wins; duration timer (0 = until cleared); pip-clear
    // (id-aware) or timer tears down. Renders into #pipContainer, never the player. Mirrors
    // the Tizen PipOverlay (tizen/js/pip-overlay.js). Teardown is wrapped so a malformed
    // payload can't wedge the layer.
    let pipTimer = null, pipCurrent = null;
    const PIP_POS = {
      'top-left': { top: '4%', left: '4%' }, 'top-right': { top: '4%', right: '4%' },
      'bottom-left': { bottom: '4%', left: '4%' }, 'bottom-right': { bottom: '4%', right: '4%' },
      'center': { top: '50%', left: '50%', transform: 'translate(-50%,-50%)' },
    };
    const pipColor = (c) => (typeof c === 'string' && /^#[0-9A-Fa-f]{6}$/.test(c)) ? c : null;
    const pipPx = (v, d) => { const n = Number(v); return (isFinite(n) && n > 0 ? n : d) + 'px'; };
    function pipReport(level, msg) {
      try { if (socket?.connected && config.deviceId) socket.emit('device:log', { device_id: config.deviceId, tag: 'pip', level, message: msg }); } catch (e) {}
    }
    // Zone diagnostics (orphaned zone_id fallback). Mirrors pipReport: stream to the
    // dashboard device-log (tag 'zone') AND the in-page debug overlay buffer.
    function zoneReport(level, msg) {
      try { if (socket?.connected && config.deviceId) socket.emit('device:log', { device_id: config.deviceId, tag: 'zone', level, message: msg }); } catch (e) {}
      try { window.__debugLog_push && window.__debugLog_push({ type: 'zone', level: level, msg: msg }); } catch (e) {}
      try { console.warn('[zone] ' + msg); } catch (e) {}
    }
    function pipTeardown() {
      try { if (pipTimer) clearTimeout(pipTimer); } catch (e) {}
      pipTimer = null; pipCurrent = null;
      // ⚠️ Remove only our own box — see the matching note in triggerStop. This used to be
      // `innerHTML = ''`, which erased a live trigger overlay while triggerActive stayed
      // non-null: its timers kept running, its lease kept ticking, device:trigger-status kept
      // reporting "active", and lower-priority triggers kept being dropped, all while the screen
      // showed a PiP box over the playlist. Media teardown guards the #146 ghost-audio path.
      const c = document.getElementById('pipContainer');
      if (c) c.querySelectorAll('.pip-box').forEach((b) => {
        b.querySelectorAll('video').forEach((v) => {
          try { v.onended = null; v.onerror = null; v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
        });
        try { b.remove(); } catch (e) {}
      });
    }
    function pipShow(p) {
      const container = document.getElementById('pipContainer');
      if (!p || !container) return;
      try {
        pipTeardown(); // single slot, last-show-wins
        const box = document.createElement('div');
        box.className = 'pip-box';
        box.__stOverlay = true;   // overlay layer, like .trigger-box — see isOverlayMedia
        box.style.width = pipPx(p.width, 480);
        box.style.height = pipPx(p.height, 360);
        box.style.background = pipColor(p.background_color) || '#000000';
        if (p.opacity != null && isFinite(Number(p.opacity))) box.style.opacity = String(Math.max(0, Math.min(1, Number(p.opacity))));
        if (p.border_radius != null && isFinite(Number(p.border_radius))) box.style.borderRadius = pipPx(p.border_radius, 0);
        const pos = PIP_POS[p.position] || PIP_POS['top-right'];
        Object.keys(pos).forEach((k) => { box.style[k] = pos[k]; });

        const hasTitle = p.title != null && p.title !== '';
        if (hasTitle) {
          const bar = document.createElement('div');
          bar.className = 'pip-title';
          bar.textContent = String(p.title);
          bar.style.color = pipColor(p.title_color) || '#ffffff';
          bar.style.background = 'rgba(0,0,0,0.45)';
          box.appendChild(bar);
        }
        let media;
        if (p.type === 'web') {
          media = document.createElement('iframe');
          media.setAttribute('frameborder', '0');
          media.setAttribute('scrolling', 'no');
          media.setAttribute('allow', ''); // mute web audio by default (deny autoplay)
          media.src = p.uri;
        } else {
          media = document.createElement('img');
          media.src = p.uri;
        }
        media.style.height = hasTitle ? 'calc(100% - 32px)' : '100%';
        media.style.objectFit = 'cover';
        box.appendChild(media);
        container.appendChild(box);
        pipCurrent = p.pip_id || '(anon)';
        const dur = Number(p.duration);
        if (isFinite(dur) && dur > 0) pipTimer = setTimeout(() => pipClear(pipCurrent), dur * 1000);
        pipReport('info', `pip show ${p.type || '?'} ${p.pip_id || ''} pos=${p.position || 'top-right'} dur=${isFinite(dur) ? dur : 0}`);
      } catch (e) {
        pipTeardown();
        pipReport('warn', 'pip show failed: ' + (e && e.message ? e.message : e));
      }
    }
    function pipClear(pipId) {
      // A clear carrying a pip_id only clears if it matches the showing overlay.
      if (pipId && pipCurrent && pipId !== pipCurrent) return;
      const had = !!pipCurrent;
      pipTeardown();
      if (had) pipReport('info', 'pip cleared' + (pipId ? ' ' + pipId : ''));
    }

    /*
     * What THIS instance can actually do, decided at registration time.
     *
     * The dashboard used to offer every control to every display, so buttons that could not
     * possibly work were shown and did nothing — a browser tab cannot reboot its host. The server
     * falls back to a per-platform baseline when a player declares nothing, so this list only has
     * to be RIGHT, not complete.
     *
     * It is computed rather than constant because the same index.html is BOTH the browser player
     * and the BrightSign player: identical code, wildly different powers depending on whether a
     * host bridge answered. Declaring a static set here would either lie for the browser or
     * under-sell BrightSign.
     *
     * Everything conditional is probed, never assumed. A capability we cannot verify is left out:
     * an absent control is a smaller failure than one that reports success and changes nothing.
     */
    function declaredCapabilities() {
      const caps = [
        // Render paths that exist in this file unconditionally.
        'playback.video', 'playback.image', 'playback.widget', 'playback.youtube',
        'playback.zones', 'playback.pip',
        /* Mounting a server-flattened bundle needs nothing this player does not already have — it
         * is the widget iframe with a different URL. Claimed unconditionally for that reason, and
         * deliberately NOT taken to mean the bundle is available offline: nothing here unpacks an
         * archive yet, so offline.cache still answers only for media. */
        'playback.bundle',
        // #129 per-item mute plus the operator volume added alongside it.
        'audio.mute', 'audio.volume',
        /* Slide voiceover + deck music bed. This player owns those elements itself (see
         * applySlideAudio), which is what the capability asserts — a player that only renders the
         * widget iframe would make no sound, because the tracks are metadata on the item. */
        'playback.slide_audio',
        // CSS transform in a browser; the host rotates the output on BrightSign. Both real.
        'display.rotation',
        'remote.input',
        'remote.stream',
        // restartPlayer() always resolves to something: the host rebuilds the widget, or the page
        // reloads. It is the one lifecycle action a browser tab can genuinely perform.
        'system.restart_player',
        'sync.clock',
      ];

      /*
       * ⚠️ Declared from the BOUND LISTENER, not from the flag or the platform. A flag that is on
       * and a port that never bound are different facts, and the operator picking screens for an
       * integrator needs the second one. Same rule as offline.cache: claim what was verified.
       */
      if (typeof triggerStats === 'object' && triggerStats.listeners && triggerStats.listeners.http) {
        caps.push('trigger.http');
      }
      if (typeof triggerStats === 'object' && triggerStats.listeners && triggerStats.listeners.udp) {
        caps.push('trigger.udp');
      }

      // Transitions are a progressive enhancement — the bundle failing to load means hard cuts,
      // not a broken player — so this reflects whether the runtime actually loaded.
      //
      // Deliberately the player's OWN predicate rather than a second guess at the global names.
      // An earlier draft here tested window.STTransitions, which does not exist: the capability
      // would simply never have been declared, hiding the transitions UI for every display, and
      // nothing would have failed loudly enough to notice.
      try {
        if (typeof transitionRuntimeReady === 'function' && transitionRuntimeReady()) {
          caps.push('playback.transitions');
        }
      } catch (e) { /* bundle absent: hard cuts, and we do not claim the capability */ }

      // Offline caching is the service worker — and the API EXISTING is not the same as it
      // working. A real BrightSign XT245 on alpha has `serviceWorker` in navigator, passes this
      // check, and then never even fetches sw.js: registration is refused by its widget runtime.
      // It declared offline.cache to the fleet and could not cache a single byte.
      //
      // So the claim is made on a worker that is actually IN CONTROL. The cost is that the very
      // first load under-reports (registration has happened but the worker has not claimed the
      // page yet) — which is the right direction to be wrong in, and self-corrects: activation
      // triggers a reload, and the next register sends the true set. `swRegistrationFailed` makes
      // the negative stick on a runtime where it will never succeed, rather than waiting on a
      // controller that is never coming.
      try {
        if (!swRegistrationFailed && navigator.serviceWorker && navigator.serviceWorker.controller) {
          caps.push('offline.cache');
        }
      } catch (e) { /* locked-down browser */ }

      // Screenshots need somewhere to draw. Same-origin content and a 2d context are the real
      // requirements; a host bridge is a second, better path (it captures the framebuffer
      // including the hardware video plane, which a canvas cannot read at all).
      try {
        const probe = document.createElement('canvas');
        probe.width = 2; probe.height = 2;
        if (probe.getContext('2d') && typeof probe.toDataURL === 'function') {
          caps.push('remote.screenshot');
        }
      } catch (e) { /* no canvas => no screenshots, and we do not claim them */ }

      // --- everything below exists ONLY behind a live host bridge ---
      // hasHost() is specifically NOT isBrightSign(): the UA check alone is true for a widget
      // built without node integration, which can reach none of this. Claiming reboot on one of
      // those is exactly the dead button this whole exercise removes.
      let host = false;
      try { host = !!(BS && BS.hasHost()); } catch (e) { host = false; }

      if (host) {
        caps.push('system.reboot');        // RebootSystem() in autorun.brs
        caps.push('display.power');        // media teardown + CEC; blanking works even where CEC does not
        caps.push('display.resolution');   // roVideoMode via the bridge
        caps.push('system.self_update');   // the autorun.zip package path
      }

      // Native frame-accurate sync needs the SyncManager module to have actually resolved, which
      // is a firmware-version question (BOS 8.2.10+), not a platform one.
      try {
        if (window.ScreenTinkerBSSync && window.ScreenTinkerBSSync.available()) caps.push('sync.native');
      } catch (e) { /* not on BrightSign */ }

      return caps;
    }

    // The version of the HOST package (autorun.brs) this player is running, or null off-platform
    // and before the host has said. It is stamped into autorun.brs at build time and arrives here
    // via a host-telemetry message, so it is NOT available synchronously at first register — see
    // maybeReportAppVersion().
    //
    // typeof, not truthiness, for the same reason the heartbeat does it: page and bridge are
    // fetched separately, so a new page can run against a CACHED older bridge that lacks this
    // method, and calling it would throw out of registration entirely.
    function hostPackageVersion() {
      try {
        if (!BS || typeof BS.telemetrySnapshot !== 'function') return null;
        const v = BS.telemetrySnapshot().package_version;
        return typeof v === 'string' && v.trim() ? v.trim() : null;
      } catch (e) { return null; }
    }

    // ⚠️ Always build the WHOLE blob. The server's applyDeviceInfo() UPDATEs every column it
    // covers unconditionally, so a partial device_info does not "patch" a row — it nulls
    // android_version and the screen dimensions and resets ota_status/tier/the flag columns.
    // device:register and device:info both land there, so both must send the full thing.
    function buildDeviceInfo() {
      return {
        android_version: 'Web/' + navigator.userAgent.split(' ').pop(),
        // On a BrightSign, app_version is the ON-DEVICE host package — the artifact OTA replaces
        // and the only one here that can be stale. PLAYER_VERSION describes this page, which the
        // server serves fresh every load, and it already travels as client_version. Reporting the
        // page version in both columns is what made an XT245 read as 1.1.0-web forever, with no
        // way to tell a freshly-provisioned host from a year-old one.
        app_version: hostPackageVersion() || PLAYER_VERSION,
        screen_width: screen.width,
        screen_height: screen.height,
      };
    }

    // What we last told the server, so a change is detectable. register() re-seeds this with
    // whatever it actually sent — null when the host had not spoken yet, which is precisely the
    // case maybeReportAppVersion() exists to repair.
    let reportedAppVersion = null;

    // The host package version is not known at first register: SendHostTelemetry runs on the
    // autorun's own schedule and can land after this page has already registered. Rather than
    // delay registration on it — which would trade a cosmetic gap for a real one — register with
    // what we have and correct the record when the host speaks up. Also covers the version
    // CHANGING under a live page, which is exactly what a self-update does, and which the
    // server turns into an 'upgrade' incident.
    // The EDID probe is asynchronous and can answer after this page has already registered, so the
    // first register often carries nothing. It travels on the REGISTER path (applyHardwareIdentity)
    // rather than device:info, so correcting it means registering again — once, when the value
    // first appears. Guarded by a flag because re-registering on every heartbeat would be absurd.
    let reportedEdid = false;
    function maybeReportEdid() {
      if (reportedEdid || !BS || typeof BS.edid !== 'function') return;
      let v = null;
      try { v = BS.edid(); } catch (e) { return; }
      if (!v) return;              // still probing, or no panel on this output
      reportedEdid = true;
      register();
    }

    function maybeReportAppVersion() {
      const v = hostPackageVersion();
      if (!v || v === reportedAppVersion) return;
      reportedAppVersion = v;
      socket.emit('device:info', { device_id: config.deviceId, device_info: buildDeviceInfo() });
    }

    function register() {
      const data = {};
      // #163: always send device identity when we have it, regardless of paired
      // status. Before this fix, a reconnect before pairing would omit device_id
      // and device_token, causing the server's fingerprint reclaim guard to fire
      // device:auth-error ("Authentication failed. Please re-pair this device.")
      // because the same browser fingerprint looked like a reinstall attack.
      if (config.deviceId) {
        data.device_id = config.deviceId;
        if (config.deviceToken) data.device_token = config.deviceToken;
      }
      if (!config.paired) {
        // Reuse the existing pairing code across reconnects so the operator
        // doesn't see a new code every time the socket flaps. Only generate a
        // fresh one on the very first registration when no code exists yet.
        if (!config.pairingCode) {
          const code = String(Math.floor(100000 + Math.random() * 900000));
          config.pairingCode = code;
          saveConfig(config);
        }
        data.pairing_code = config.pairingCode;
      }
      data.device_info = buildDeviceInfo();
      // Record what this register just carried, so maybeReportAppVersion() only speaks when the
      // host actually tells us something we have not already sent.
      reportedAppVersion = hostPackageVersion();
      // v4 client identity block — additive, canonical snake_case (same shape as APK/.wgt so the
      // server consumes one thing). Backward-compatible: an old server ignores unknown fields.
      data.client_type = 'player';
      data.client_version = PLAYER_VERSION;
      // A BrightSign must say so rather than registering as "Chrome 120", because the sync
      // resolver (server/lib/sync-backend.js) decides native-vs-ours from exactly this field —
      // and a wall that reports itself as a browser can never be offered BrightWall.
      data.platform = ON_BRIGHTSIGN ? 'brightsign' : browserPlatform();
      if (ON_BRIGHTSIGN) {
        try {
          data.bs_model = BS.model() || null;
          data.bs_os_version = BS.osVersion() || null;
          data.bs_serial = BS.serial() || null;
          // Which physical output this widget paints. autorun.brs gives the second output its
          // own widget with &screen=2, so two rows from one player stay distinguishable.
          data.bs_screen = BS.screen();
          data.sync_backend = BS.syncBackend();
          // The attached panel's raw EDID (base64), parsed server-side. Identity, not telemetry:
          // it changes when someone swaps the screen, so it rides the register next to bs_model
          // and bs_serial rather than the 15s heartbeat. typeof-guarded because the bridge is
          // fetched separately from this page and may predate the method.
          if (typeof BS.edid === 'function') data.bs_edid = BS.edid() || null;
        } catch (e) { /* identity extras are additive — never block registration */ }
      }
      // What this instance can actually do. The server persists it and the dashboard hides the
      // controls it does not contain, so a display never shows a button that cannot work.
      data.capabilities = declaredCapabilities();
      data.contract_version = 'v4';
      // Device identity. `fingerprint` is per-INSTALL and is what the server matches on.
      // `hw_fingerprint` is the old hardware-only value, sent alongside so a panel whose storage
      // was wiped can still be rematched to its row — but only when that value is unambiguous.
      data.fingerprint = generateBrowserFingerprint();
      data.hw_fingerprint = generateHardwareFingerprint();
      /*
       * #313: the enrolment key from ?k=, sent ONLY when we have no device_id of our own. The
       * server exchanges it for this display's id and token at the top of its register handler, so
       * everything after that is an ordinary reconnect. A player with working storage never sends
       * it, because getConfig() only carries it when there is no stored identity to prefer.
       */
      if (!data.device_id && config.enrolKey) data.enrol_key = config.enrolKey;
      console.log(`[register] device_id=${data.device_id || 'none'}, has_token=${!!data.device_token}, token_len=${data.device_token?.length || 0}, paired=${config.paired}, pairing_code=${data.pairing_code || 'none'}, enrol_key=${data.enrol_key ? 'yes' : 'no'}`);
      socket.emit('device:register', data);
    }

    // ==================== Heartbeat ====================
    function startHeartbeat() {
      stopHeartbeat();
      heartbeatTimer = setInterval(() => {
        if (!socket?.connected || !config.deviceId) return;
        // Piggy-backed on the heartbeat rather than given its own timer: this is the one loop
        // already guaranteed to be running whenever the socket is up, and the host version is a
        // fact that changes at most once per update.
        maybeReportAppVersion();
        maybeReportEdid();
        socket.emit('device:heartbeat', {
          device_id: config.deviceId,
          client_ms: Date.now(),   // #group-sync: t1 for NTP-style clock discipline (echoed in the ack)
          telemetry: {
            battery_level: null,
            // ⚠️ null, NOT false. `false` asserts "this screen is on battery and is not
            // charging" — a claim the web cannot make: Firefox removed the Battery Status API
            // and Chrome gates it. Sending false made this the ONLY telemetry field populated on
            // 100% of rows while battery_level sat at 36%, because every web player was
            // fabricating one. Nothing displays it, so the lie was invisible — and mirroring it
            // up a mesh would have spread it fleet-wide. null means unknown, which is true.
            battery_charging: null,
            storage_free_mb: null,
            storage_total_mb: null,
            ram_free_mb: null,
            ram_total_mb: null,
            cpu_usage: null,
            // 'Web Player' is a placeholder standing in a WiFi column. On a BrightSign it is
            // actively wrong — the one we have is PoE over Ethernet — and an operator reading it
            // as an SSID has been told something false. Null means "not on WiFi", which is true,
            // and the dashboard shows a real hardware block for this family instead.
            // wifi_ssid is GONE (Phase −1). 94% of its production values were not SSIDs at all
            // — this line used to send the literal string "Web Player", 151,713 rows of it — and
            // the 6% that WERE real were customer network names, which are geolocatable against
            // public wardriving databases. Nothing read it and no feature needed it.
            wifi_rssi: null,
            uptime_seconds: Math.floor(performance.now() / 1000),
            // #74/#75: report OS timezone + UTC clock (effective-tz resolution + skew indicator)
            timezone: (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch (e) { return null; } })(),
            device_utc: Date.now(),
            // Real values where the platform has them (temperature, storage quota). Spread LAST so
            // it overrides the nulls above, and empty off-platform so nothing else changes.
            // typeof, not truthiness: the bridge and this page are halves of one contract but are
            // fetched separately, so a player can run a NEW page against a CACHED older bridge.
            // Calling a method that version lacks threw here every 15s and took the whole heartbeat
            // with it — the display kept playing while silently reporting nothing at all.
            ...(BS && typeof BS.telemetrySnapshot === 'function' ? BS.telemetrySnapshot() : {}),
          }
        });
      }, HEARTBEAT_INTERVAL);
    }

    function stopHeartbeat() { if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; } }

    function startPlaylistRefresh() {
      // No longer needed — server pushes playlist updates instantly via WebSocket.
      // Kept as a fallback with a long interval in case a push is missed.
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        if (socket?.connected && config.deviceId && config.paired) {
          const data = { device_id: config.deviceId, device_info: {} };
          if (config.deviceToken) data.device_token = config.deviceToken;
          console.log(`[refresh-register] device_id=${config.deviceId}, has_token=${!!config.deviceToken}`);
          socket.emit('device:register', data);
        }
      }, 300000); // 5 minutes fallback
    }

    // ==================== Auto-reload on code update ====================
    let knownServerHash = null;
    let versionCheckTimer = null;
    function startVersionCheck() {
      if (versionCheckTimer) clearInterval(versionCheckTimer);
      // Initial fetch to learn current hash
      fetch(config.serverUrl + '/api/version').then(r => r.json()).then(data => {
        knownServerHash = data.hash;
        console.log('Server version:', data.version, 'hash:', data.hash);
      }).catch(() => {});
      // Poll every 30s
      versionCheckTimer = setInterval(() => {
        fetch(config.serverUrl + '/api/version').then(r => r.json()).then(data => {
          if (knownServerHash && data.hash !== knownServerHash) {
            console.log('Server code updated, reloading...', knownServerHash, '->', data.hash);
            // THE deploy path — this is the exact line that darkened a BrightSign panel on
            // 2026-07-28, when every connected player self-reloaded and that one never returned.
            restartPlayer('server code updated');
          }
        }).catch(() => {});
      }, 30000);
    }

    // ==================== Video Wall ====================
    // Convert a wall_config payload into CSS that sizes & positions the wall
    // stage so this device's tile is the visible portion. Each tile is
    // 100vw × 100vh; the stage is the full grid, translated by this tile's
    // grid position (plus bezel offsets in px between tiles).
    // #200: keep advanceTimer consistent with the current playback mode. A schedule-driven device (wall
    // FOLLOWER or group member) runs NO local advance timer — its tick drives the index, and a stale solo
    // timer would spuriously advance and desync (zombie timer, Bug B). A solo player or wall LEADER
    // advances locally, so on the way OUT of a schedule-driven mode a surviving image/widget item (which
    // never armed a timer while driven) would freeze (Bug C) — re-render it (buffered, no flash) to re-arm.
    // Video/YouTube self-advance via their own end handlers and re-rendering would restart them, so leave
    // those alone. Called on every mode enter/exit (applyWallMode/applyGroupSync), which is the single
    // chokepoint every transition path routes through.
    function reconcileAdvanceTimerForMode() {
      if (isWallFollower() || groupSync) {
        if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
        return;
      }
      if (!isPlaying) return;
      const item = playlist[currentIndex];
      if (!item || advanceTimer) return;   // solo/leader that already has its timer armed -> nothing to do
      // Video and YouTube were excluded here on the grounds that they "self-advance via their own
      // end handlers" — but the handler that is live right now was built for the mode we have just
      // LEFT. A group-rendered video was created with `loop = !!groupSync` and a wall-follower
      // video with `isFollower` true, and both are captured in the closure at render time. So on
      // leaving a sync group or a wall, that element loops forever and nothing re-renders: the
      // screen sits on one clip permanently, and later refreshes take the "unchanged" branch
      // because the <video> is attached, playing and un-errored, i.e. healthy.
      //
      // Re-render whatever is on screen instead of guessing which types can look after themselves.
      const mediaEl = document.querySelector('#playerContainer video');
      const staleLoop = !!(mediaEl && mediaEl.loop);
      const needsSoloTimer = !!item.widget_id
        || (typeof item.mime_type === 'string' && item.mime_type.startsWith('image/'))
        || staleLoop
        || item.mime_type === 'video/youtube';
      if (needsSoloTimer) playCurrentItem();   // re-render buffered + re-arm the solo advance timer
    }

    function applyWallMode(config) {
      const container = document.getElementById('playerContainer');
      // Tear down previous wall mode (clear sync timer regardless of new state)
      if (wallSyncTimer) { clearInterval(wallSyncTimer); wallSyncTimer = null; }
      lastWallSync = null;

      if (!config) {
        wallConfig = null;
        container.classList.remove('wall-mode');
        console.log('[wall] exited wall mode');
        reconcileAdvanceTimerForMode();   // #200: back to solo -> re-arm a surviving image/widget's timer
        return;
      }
      wallConfig = config;
      container.classList.add('wall-mode');
      console.log('[wall] applyWallMode wall=' + config.wall_id + ' is_leader=' + config.is_leader + ' userHasInteracted=' + userHasInteracted);

      // Enforce the audio rule on the currently-mounted video right now.
      // If the role flipped (e.g., leader was reassigned mid-stream), the
      // existing video element keeps its old muted state until we touch it.
      if (currentVideoEl) {
        if (config.is_leader) {
          // Defer to autoplay policy — leader can be unmuted once the user
          // has gestured. Don't yank audio if it's already playing.
        } else {
          if (!currentVideoEl.muted) currentVideoEl.muted = true;
        }
      }

      if (config.is_leader) {
        // Leader emits at 4Hz so followers can apply small playbackRate
        // corrections instead of jerk-seeking. Higher rates would saturate
        // the relay; 4Hz balances tightness against server load.
        wallSyncTimer = setInterval(emitWallSync, 250);
        // Immediate broadcast so any follower that's already up aligns now,
        // without waiting up to 250ms for the first scheduled tick. This
        // also covers a leader reclaiming the role after a reconnect.
        setTimeout(emitWallSync, 100);
      } else {
        // Follower: ask the leader for its current position. Without this,
        // the screen shows the start of the current item until the leader's
        // next periodic tick (up to ~1s of visible drift on a fresh join).
        if (socket?.connected) {
          console.log('[wall] follower emitting sync-request for wall ' + config.wall_id);
          socket.emit('wall:sync-request', { wall_id: config.wall_id });
        }
      }
      reconcileAdvanceTimerForMode();   // #200: follower -> kill any stale solo timer; leader keeps its own
    }

    function emitWallSync() {
      if (!wallConfig?.is_leader || !socket?.connected || playlist.length === 0) return;
      const item = playlist[currentIndex];
      if (!item) return;
      const position = currentVideoEl
        ? (currentVideoEl.currentTime || 0)
        : Math.max(0, (Date.now() - currentItemStartedAt) / 1000);
      socket.emit('wall:sync', {
        wall_id: wallConfig.wall_id,
        device_id: config.deviceId,
        current_index: currentIndex,
        content_id: item.content_id || null,
        position_sec: position,
        sent_at: Date.now(),
      });
    }

    // #group-sync schedule engine. The shared, deterministic playlist schedule (each item occupies
    // duration_sec, in order, skipping dayparted-out items) is laid on the synced clock: phase =
    // syncedNow mod totalPeriod. Every same-playlist member computes the identical (index, position)
    // — no leader, no relay, no split-brain — and it keeps running with no server at all.
    function groupScheduleSlots() {
      const slots = []; let acc = 0;
      for (let i = 0; i < playlist.length; i++) {
        if (!scheduleAllows(playlist[i])) continue;                       // same daypart filter as solo playback
        const dur = Math.max(1, Number(playlist[i].duration_sec) || 10) * 1000;
        slots.push({ index: i, start: acc, dur }); acc += dur;
      }
      return { slots, period: acc };
    }
    function groupScheduleTarget() {
      const { slots, period } = groupScheduleSlots();
      if (!slots.length || period <= 0) return null;
      const phase = ((syncedNow() % period) + period) % period;
      let ci = slots.findIndex(x => phase >= x.start && phase < x.start + x.dur);
      if (ci < 0) ci = slots.length - 1;
      const s = slots[ci];
      const next = slots[(ci + 1) % slots.length];
      // nextIndex + secToBoundary drive the double buffer (preload the upcoming clip a few s early).
      return { index: s.index, posSec: (phase - s.start) / 1000, nextIndex: next.index, secToBoundary: (s.start + s.dur - phase) / 1000 };
    }
    // Runs at 4Hz while in a group: snap the index to the schedule, and for video correct drift with
    // the same seek/nudge maths the wall uses — but toward the SCHEDULE target, not a leader broadcast.
    function groupScheduleTick() {
      if (!groupSync || playlist.length === 0) return;
      const t = groupScheduleTarget();
      if (!t) {
        // period === 0 means every item is currently outside its daypart. Solo playback routes the
        // same condition into showNothingScheduled(); group playback just returned, so nothing was
        // watching — group members are scheduleDriven, so renderContent arms no advanceTimer, and
        // a group-rendered video is created with loop = !!groupSync. Out of hours the whole group
        // therefore kept displaying (or looping) whatever had been in-window last, while an
        // identical ungrouped screen correctly showed the idle card.
        if (isPlaying) {
          teardownCurrentMedia();
          showNothingScheduled();
        }
        return;
      }
      // Double buffer: warm the next clip ~6s before the boundary (once per boundary).
      if (t.nextIndex !== t.index && t.secToBoundary >= 0 && t.secToBoundary <= 6 && groupPreloadIdx !== t.nextIndex) {
        groupPreloadNext(t.nextIndex);
      }
      let action = 'hold';
      if (t.index !== currentIndex) {
        currentIndex = t.index;
        playCurrentItem();
        action = 'jump>' + t.index;
        // LEADER ONLY: open a new sync session for the item we just moved to. The id must change
        // on every advance or the followers' 1Hz dedupe swallows it and the group sits on the
        // previous item forever.
        if (nativeSync && groupSync.is_leader && nativeSyncAnnounced !== t.index) {
          nativeSyncAnnounced = t.index;
          const key = (playlist[t.index]?.content_id || playlist[t.index]?.id || t.index);
          nativeSync.announce(key, Date.now());
        }
      } else if (nativeSync) {
        // Native sync owns alignment: setSyncParams has the element keeping itself in step, so the
        // seek/nudge maths below would fight it — every correction we applied would be a frame the
        // player then had to undo. Just make sure the current item is bound.
        bindNativeSyncVideo();
        action = 'native';
      } else if (currentVideoEl && isFinite(currentVideoEl.duration) && currentVideoEl.duration > 0) {
        const dur = currentVideoEl.duration;
        const target = t.posSec % dur;                                    // loop-safe when duration_sec > clip length
        const drift = (currentVideoEl.currentTime || 0) - target;
        const ad = Math.abs(drift);
        if (currentIndex !== groupLastAlignedIndex) groupAlignPending = true;
        if (groupAlignPending) {
          if (ad > 0.05) { try { currentVideoEl.currentTime = target; } catch (e) {} groupLastSeekAt = Date.now(); }
          try { currentVideoEl.playbackRate = 1.0; } catch (e) {}
          groupAlignPending = false; groupLastAlignedIndex = currentIndex;
          action = 'align ' + drift.toFixed(2);
        }
        else if (ad > 0.3 && Date.now() - groupLastSeekAt > 1200) { try { currentVideoEl.currentTime = target; } catch (e) {} try { currentVideoEl.playbackRate = 1.0; } catch (e) {} groupLastSeekAt = Date.now(); action = 'seek ' + drift.toFixed(2); }
        else if (ad > 0.05) { try { currentVideoEl.playbackRate = drift > 0 ? 0.97 : 1.03; } catch (e) {} action = 'nudge ' + drift.toFixed(2); }
        else if (currentVideoEl.playbackRate !== 1.0) { try { currentVideoEl.playbackRate = 1.0; } catch (e) {} }
      }
      // Log discrete corrections (jump/align/seek) immediately so the transition is visible; only the
      // routine steady-state line (hold/nudge) is throttled — else the one-tick "align" on load is
      // sampled over by a later "hold"/"nudge" and reads misleadingly.
      const now = Date.now();
      const discrete = action.indexOf('jump') === 0 || action.indexOf('align') === 0 || action.indexOf('seek') === 0;
      if (discrete || now - groupDbgLast > 1000) {
        groupDbgLast = now;
        groupReport('info', 'idx=' + currentIndex + ' tgt=' + t.index + ' pos=' + t.posSec.toFixed(2) + ' off=' + clockOffsetMs + 'ms rtt=' + clockRttMs + 'ms ' + action);
      }
    }

    // Double buffer: build a hidden, buffering <video> for the next clip so renderContent can mount it
    // instantly at the boundary (no black hold). Only for videos; images/widgets/youtube skip it.
    function groupPreloadNext(idx) {
      const item = playlist[idx];
      if (!item) return;
      const isVid = item.mime_type && item.mime_type.indexOf('video/') === 0 && item.mime_type !== 'video/youtube';
      if (!isVid) { groupPreloadIdx = idx; groupPreloadEl = null; return; }   // mark handled, nothing to warm
      const url = mediaUrl(item);
      try {
        if (groupPreloadEl) { try { groupPreloadEl.remove(); } catch (e) {} }
        const v = document.createElement('video');
        v.src = url; v.muted = true; v.playsInline = true; v.preload = 'auto';
        v.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px';
        v.load();
        document.body.appendChild(v);
        groupPreloadEl = v; groupPreloadIdx = idx;
        groupReport('info', 'preload>' + idx);
      } catch (e) { groupPreloadEl = null; groupPreloadIdx = -1; }
    }
    // Hand off the preloaded element for `idx` (or null). Caller re-parents + plays it; src is already
    // set and buffered, so playback starts near-instantly with no reload.
    function takeGroupPreload(idx) {
      if (groupPreloadIdx === idx && groupPreloadEl) { const el = groupPreloadEl; groupPreloadEl = null; groupPreloadIdx = -1; return el; }
      return null;
    }

    // Enter/leave group sync. No CSS transform, no forced mute (per-item mute honored), no leader —
    // just start the schedule tick. Idempotent across refreshes/role churn (there is no role now).
    // Enter/leave BrightSign native sync for this group. Returns true if it is running afterwards.
    // Deliberately fails CLOSED: if the module is missing, the platform is not BrightSign, or the
    // session will not start, we return false and the caller keeps the clock-derived path — a group
    // that silently ran neither protocol would drift with no indication of why.
    function applyNativeSync(cfg) {
      const want = cfg && cfg.backend === 'brightsign';
      if (!want || !global_ScreenTinkerBSSync() || !global_ScreenTinkerBSSync().available()) {
        if (nativeSync) { try { nativeSync.stop(); } catch (e) {} }
        nativeSync = null; nativeSyncEvent = null; nativeSyncBoundId = null; nativeSyncAnnounced = -1;
        if (want) groupReport('warn', 'native sync requested but SyncManager is unavailable — using clock sync');
        return false;
      }
      if (nativeSync) { try { nativeSync.stop(); } catch (e) {} nativeSync = null; }
      nativeSyncEvent = null; nativeSyncBoundId = null; nativeSyncAnnounced = -1;

      const s = global_ScreenTinkerBSSync().create({ domain: 'ST-' + String(cfg.group_id).slice(0, 8) });
      // The leader receives its OWN broadcast and starts from that, like every follower — starting
      // at announce() time instead would put it ahead of the group by the width of the network.
      s.onItem = function (ev) { nativeSyncEvent = ev; bindNativeSyncVideo(); };
      if (!s.start(!!cfg.is_leader)) {
        groupReport('warn', 'native sync failed to start — using clock sync');
        return false;
      }
      nativeSync = s;
      console.log('[native-sync] started as ' + (cfg.is_leader ? 'LEADER' : 'follower') + ' group=' + cfg.group_id);
      groupReport('info', 'native sync started (' + (cfg.is_leader ? 'leader' : 'follower') + ')');
      return true;
    }
    function global_ScreenTinkerBSSync() {
      return (typeof window !== 'undefined' && window.ScreenTinkerBSSync) || null;
    }
    // Bind the mounted video to the current session, exactly once per sync id. The event can arrive
    // before the element exists (the leader announces as it advances), so this is called both from
    // the event and from the tick — whichever wins, the guard makes it idempotent.
    function bindNativeSyncVideo() {
      if (!nativeSync || !nativeSyncEvent) return;
      if (nativeSyncEvent.id === nativeSyncBoundId) return;
      if (!currentVideoEl) return;                 // images/widgets have no setSyncParams to bind
      if (nativeSync.attachVideo(currentVideoEl, nativeSyncEvent)) {
        nativeSyncBoundId = nativeSyncEvent.id;
        groupReport('info', 'native sync bound id=' + String(nativeSyncEvent.id).slice(0, 24));
      }
    }

    function applyGroupSync(cfg) {
      if (groupSyncTimer) { clearInterval(groupSyncTimer); groupSyncTimer = null; }
      try { if (cfg) localStorage.setItem('st_group_sync', JSON.stringify(cfg)); else localStorage.removeItem('st_group_sync'); } catch (e) {}
      if (!cfg) {
        applyNativeSync(null);
        if (groupSync) groupReport('info', 'group-sync exited'); groupSync = null; console.log('[group-sync] exited');
        if (groupPreloadEl) { try { groupPreloadEl.remove(); } catch (e) {} groupPreloadEl = null; groupPreloadIdx = -1; }
        reconcileAdvanceTimerForMode();   // #200: back to solo -> re-arm a surviving image/widget's timer
        return;
      }
      const first = !groupSync;
      groupSync = cfg;
      groupAlignPending = true; groupLastAlignedIndex = -1;   // snap the first item into sync on entry
      // Tell the host which protocol won, so a cold boot with no network starts in the right mode.
      try { if (BS && cfg.backend) BS.setSyncBackend(cfg.backend); } catch (e) { /* not on BrightSign */ }
      if (cfg.sync_downgraded && cfg.sync_reason) {
        groupReport('warn', 'sync downgraded to ' + cfg.backend + ': ' + cfg.sync_reason);
      }
      applyNativeSync(cfg);
      console.log('[group-sync] group=' + cfg.group_id + ' backend=' + (cfg.backend || 'screentinker')
        + ' (clock/schedule, offset=' + clockOffsetMs + 'ms)');
      groupReport('info', 'group-sync ' + (first ? 'entered' : 'refresh') + ' group=' + String(cfg.group_id).slice(0, 8) + ' off=' + clockOffsetMs + 'ms');
      groupScheduleTick();                                    // align immediately
      groupSyncTimer = setInterval(groupScheduleTick, 250);   // 4Hz local correction
      reconcileAdvanceTimerForMode();   // #200: group member runs no solo timer -> kill any zombie
    }

    // Map the player rect into this device's viewport using vw/vh so the
    // viewport fills edge-to-edge (no pillarbox at the seam between adjacent
    // screens). With object-fit:fill on the video, the source stretches to
    // the stage — which keeps the vertical position of every source pixel
    // identical across devices that share a viewport height (1vh maps to
    // the same physical pixel on each).
    // #236: the geometry (including per-panel mounting rotation) comes from the shared rule in
    // server/lib/wall-geometry.js. Kept out of here because Tizen, Android and this player must
    // agree to the pixel across a seam, and because the rotated cases are only checkable by test.
    function styleWallStage(stageEl) {
      if (!wallConfig?.screen_rect || !wallConfig?.player_rect) return;
      const s = wallConfig.screen_rect;
      const p = wallConfig.player_rect;
      if (!s.w || !s.h) return;
      const st = window.WallGeometry
        ? window.WallGeometry.wallStageStyle(s, p, wallConfig.rotation)
        // If the shared script failed to load, fall back to the unrotated rule rather than leaving
        // the stage unstyled — a wrong-but-full-frame panel beats a blank one on a live wall.
        : {
            left: (((p.x - s.x) / s.w) * 100) + 'vw',
            top: (((p.y - s.y) / s.h) * 100) + 'vh',
            width: ((p.w / s.w) * 100) + 'vw',
            height: ((p.h / s.h) * 100) + 'vh',
            transform: '', transformOrigin: '',
          };
      if (!st) return;
      const dev = (config.deviceId || '?').slice(0, 8);
      console.log('[wall/render ' + dev + '] screen_rect: ' + JSON.stringify(s) + ' player_rect: ' + JSON.stringify(p) + ' rotation=' + (wallConfig.rotation || 0));
      console.log('[wall/render ' + dev + '] viewport: ' + window.innerWidth + 'x' + window.innerHeight + ' DPR=' + window.devicePixelRatio);
      console.log('[wall/render ' + dev + '] stage: left=' + st.left + ' top=' + st.top + ' width=' + st.width + ' height=' + st.height + ' transform=' + (st.transform || 'none'));
      stageEl.style.left = st.left;
      stageEl.style.top = st.top;
      stageEl.style.width = st.width;
      stageEl.style.height = st.height;
      stageEl.style.transform = st.transform;
      stageEl.style.transformOrigin = st.transformOrigin;
    }

    // No-op kept for callers that bind a resize listener (kept around in case
    // future zoom/orientation tweaks need it). vw/vh stage updates with the
    // viewport automatically, so explicit re-style isn't needed today.
    function bindWallResizeOnce() {}

    // ==================== Playlist ====================
    function handlePlaylistUpdate(data) {
      // Check if device is suspended (trial expired / over limit)
      if (data.suspended) {
        isPlaying = false;
        playlist = [];
        document.getElementById('playerContainer').style.display = 'none';
        const overlay = document.getElementById('statusOverlay');
        overlay.style.display = 'flex';
        overlay.innerHTML = `
          <div style="text-align:center;max-width:500px">
            <div style="font-size:64px;margin-bottom:16px">&#9888;</div>
            <h2 style="color:#f59e0b;margin-bottom:8px">${data.message || 'Account Suspended'}</h2>
            <p style="color:#94a3b8;font-size:16px;margin-bottom:24px">${data.detail || 'Please upgrade your plan.'}</p>
            <p style="color:#64748b;font-size:13px">Visit your dashboard to manage your subscription</p>
          </div>
        `;
        return;
      }

      const newItems = data.assignments || [];
      // Build fingerprint from id + url + filename to detect any content change.
      // #74/#75: include schedules so a schedule edit (same content) is detected too.
      // transition-engine: include the per-item transition too, or a transition config change (effects,
      // duration, scope, or presence) keeps the SAME fingerprint -> "unchanged" -> the player keeps a
      // stale cached playlist and never applies the new transitions. This bug hid every transition edit.
      // STRUCTURAL fingerprint only (identity + order + schedules + transition). duration_sec, muted,
      // captions, subtitles and title are deliberately EXCLUDED: this fingerprint decides RESTART vs
      // NO RESTART, and none of those need a restart. They are synced in place in the unchanged
      // branch below, which is where any new per-item field is picked up for free.
      // ⚠️ Do not "fix" a field being ignored by adding it here — that trades a stale value for a
      // playlist restart on every edit of it, which is #234 (a rebuild restarting at item 1). Adding
      // duration_sec here is the fix suggested in #295; it is right for 1.9.0, which had no in-place
      // path, and wrong for this branch, which does.
      // widget_rev is in here for the same reason as schedules and transition: a widget's IDENTITY
      // does not change when it is EDITED, so a content edit produced an identical fingerprint, the
      // update was treated as "unchanged", and the screen kept the old render until a reload.
      const fingerprint = (items) => items.map(a => `${a.content_id || ''}|${a.widget_id || ''}|${a.widget_rev || ''}|${a.zone_id || ''}|${a.remote_url || ''}|${a.filepath || ''}|${a.filename || ''}|${JSON.stringify(a.schedules || [])}|${JSON.stringify(a.transition || null)}`).join(',');
      const newFp = fingerprint(newItems);
      const oldFp = fingerprint(playlist);

      // Apply orientation. #109: the PiP layer gets the SAME transform as the player so a
      // corner overlay tracks the visible content (not the physical panel) in every orientation.
      // #236: on a wall panel that carries its own mounting rotation, the two settings describe the
      // SAME physical fact, so honouring both turns the content twice and throws it off-screen. The
      // wall rotation wins there; when it is 0 (every wall in the field today) nothing changes.
      const effectiveOrientation = window.WallGeometry
        ? window.WallGeometry.orientationForWallMember(data.orientation, data.wall_config?.rotation)
        : data.orientation;
      // #320: an operator's uploaded shaders arrive with the playlist, keyed by the same ids the
      // items reference. The renderer resolves a shader by looking one up in this object, so
      // merging is the entire integration — no fetch, no cache, no new failure mode. An id that
      // never arrives simply is not found, and the player hard-cuts exactly as it always has.
      if (data.custom_shaders && typeof data.custom_shaders === 'object' && window.__TRANSITION_SHADERS) {
        for (const id in data.custom_shaders) {
          if (typeof data.custom_shaders[id] === 'string') window.__TRANSITION_SHADERS[id] = data.custom_shaders[id];
        }
      }
      // #325: the letterbox colour behind content that does not fill the frame. Applied before
      // orientation so a rotation reflow does not flash the old colour. An absent value leaves the
      // stylesheet's black exactly as it was.
      if (data.background_color && /^#[0-9a-fA-F]{3,8}$/.test(data.background_color)) {
        const stage = document.getElementById('playerContainer');
        if (stage) stage.style.background = data.background_color;
        document.body.style.background = data.background_color;
      }
      if (data.orientation) {
        // On BrightSign, rotate the OUTPUT first. Video decodes onto a hardware plane the DOM
        // cannot transform, so the CSS rotation below turns the images and widgets and leaves the
        // video unrotated — a portrait panel playing sideways video. Tizen hit the same wall and
        // routes portrait video through AVPlay for exactly this reason.
        //
        // If the host rotates the screen, EVERY layer turns with it and the CSS transform must be
        // cleared or the graphics rotate twice. If it cannot, we fall through to CSS, which rotates
        // most of the content rather than none of it.
        if (BS && typeof BS.setOrientation === 'function' && BS.hasHost()) {
          BS.setOrientation(effectiveOrientation).then((rotatedByHost) => {
            if (!rotatedByHost) return;   // CSS path below already ran
            [document.getElementById('playerContainer'), document.getElementById('pipContainer')]
              .forEach((el) => {
                if (!el) return;
                el.style.transform = '';
                el.style.width = '';
                el.style.height = '';
              });
            console.log('[bs] output rotated by host; CSS transform cleared');
          });
        }
        // Geometry from the shared rule (server/lib/orientation-style.js). The previous inline
        // version rotated the container about its own centre while it stayed pinned top-left, so
        // portrait content landed 420px off-screen on a 1920x1080 panel — rotated correctly and
        // placed wrongly. Tizen and Android both centre the box first; the web player did not.
        const st = window.OrientationStyle
          ? window.OrientationStyle.orientationStyle(effectiveOrientation)
          : null;
        if (st) {
          [document.getElementById('playerContainer'), document.getElementById('pipContainer')]
            .forEach((el) => {
              if (!el) return;
              el.style.transform = st.transform;
              el.style.transformOrigin = st.transformOrigin;
              el.style.width = st.width;
              el.style.height = st.height;
              el.style.top = st.top;
              el.style.left = st.left;
            });
        }
      }

      // Apply (or clear) wall mode. Force re-render when wall config changes
      // even if the playlist itself didn't, so leader/follower role transitions
      // and tile reassignments take effect immediately.
      function wallKey(c) {
        if (!c) return '';
        const s = c.screen_rect || {}, p = c.player_rect || {};
        // #236: rotation is part of the key. Left out, re-hanging a panel and changing only its
        // rotation in the editor looks like "no change" and the panel keeps the old transform until
        // it is rebooted — which reads as the editor silently ignoring you.
        return `${c.wall_id}:${c.is_leader}:r${c.rotation || 0}:s${s.x},${s.y},${s.w},${s.h}:p${p.x},${p.y},${p.w},${p.h}`;
      }
      const wallChanged = wallKey(wallConfig) !== wallKey(data.wall_config);
      if (wallChanged) applyWallMode(data.wall_config || null);
      // A fresh playlist-update on a follower (typical after socket reconnect)
      // is a good signal to ask the leader for its current position even when
      // the wall config itself didn't change. Cheap, debounced server-side.
      if (!wallChanged && wallConfig && !wallConfig.is_leader && socket?.connected) {
        socket.emit('wall:sync-request', { wall_id: wallConfig.wall_id });
      }
      // #group-sync: enter/leave on group membership change (mutually exclusive with wall — the
      // server sends group_sync=null for a wall member). A plain refresh re-aligns the schedule
      // locally (no server round-trip needed).
      //
      // The clock-derived protocol has no leader and one mode, so the group id alone used to be
      // enough. Native sync has both: switching protocol, or leadership moving because the old
      // leader went offline, changes what THIS player must do — and neither changes the group id.
      // Keying on the id alone would leave a player running the old protocol, or leave a promoted
      // leader silently not announcing, until something unrelated forced a re-enter.
      const groupKey = (g) => (g ? [g.group_id, g.backend || '', g.is_leader ? 'L' : 'f'].join('|') : '');
      const groupChanged = groupKey(groupSync) !== groupKey(data.group_sync);
      if (groupChanged) applyGroupSync(data.group_sync || null);
      else if (groupSync) groupScheduleTick();

      // The layout is not part of the item list, so a change to it can never show up in the item
      // fingerprint — and in multi-zone mode nothing else re-renders: each zone runs its own timers
      // and renderContent is not called again. So editing zones, moving an item between zones,
      // switching layout or clearing it did nothing at all on a screen already in a layout, for as
      // long as the item list happened to stay the same. Tizen's ZoneRenderer has always compared a
      // zone signature; this is the web equivalent.
      const layoutSig = (l) => !l ? '' : [
        l.id,
        ...(l.zones || []).map(z => [z.id, z.x_percent, z.y_percent, z.width_percent, z.height_percent,
                                     z.z_index, z.zone_type, z.fit_mode].join(':')).sort(),
      ].join('|');
      const layoutChanged = layoutSig(layout) !== layoutSig(data.layout || null);
      layout = data.layout || null;
      saveLayoutCache(layout);
      playerTimezone = data.timezone || null; // #74/#75: effective tz for schedule eval

      /*
       * Triggers are adopted here, beside the layout and for the same reasons: they are top-level
       * payload state, not per-item, so they get their own signature rather than joining the item
       * fingerprint. Adopting them BEFORE the unchanged-branch early return below is deliberate — a
       * playlist that has not changed is the common case, and it is exactly when a trigger edit
       * would otherwise be dropped on the floor.
       */
