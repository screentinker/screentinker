<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!--
    Player debug error trap. MUST stay first inside <head> after the two
    mandatory <meta> tags (charset must come first per HTML spec). Runs
    before any other script so we capture errors even from parse-time
    failures in scripts that come after. Vanilla ES5 syntax (var, function,
    no arrow/const/template) so it loads on ancient WebKit forks (Tizen 4,
    older WebOS, Fire TV stick Gen 1, embedded signage browsers). Wrapped
    in defensive try/catch so this script can never be the reason the
    player won't boot.
  -->
  <script>
  (function () {
    try {
      if (!window.__debugLog) window.__debugLog = [];
      var MAX_LOG = 200;
      var INIT_T = (function () { try { return Date.now(); } catch (e) { return new Date().getTime(); } })();

      function nowMs() {
        try { return Date.now(); } catch (e) { return new Date().getTime(); }
      }

      // Live subscribers (the player's set_debug sink). Kept HERE rather than in the player
      // script so entries recorded during boot -- before the player has even parsed -- reach a
      // subscriber that registers later, via the backlog in window.__debugLog.
      var subs = [];
      var notifying = false;

      function pushLog(entry) {
        try {
          entry.t = nowMs();
          window.__debugLog.push(entry);
          if (window.__debugLog.length > MAX_LOG) {
            window.__debugLog.splice(0, window.__debugLog.length - MAX_LOG);
          }
        } catch (e) { /* we are the safety net; do not crash */ }
        // Reentrancy guard, and it is not theoretical: this runs inside the console wrapper
        // below, so a subscriber that logs anything at all -- directly, or through a library --
        // would call back in here and recurse until the stack gave out. The player would die of
        // its own diagnostics.
        if (notifying) return;
        notifying = true;
        try {
          for (var s = 0; s < subs.length; s++) {
            try { subs[s](entry); } catch (e) { /* one bad subscriber must not eat the rest */ }
          }
        } finally { notifying = false; }
      }
      window.__debugLog_push = pushLog; // shared pusher for debug-overlay.js
      window.__debugLog_subscribe = function (fn) {
        try { if (typeof fn === 'function') subs.push(fn); } catch (e) {}
      };

      pushLog({
        type: 'init',
        ua: (navigator && navigator.userAgent) || '',
        url: location.href,
        sw: typeof screen !== 'undefined' ? screen.width : null,
        sh: typeof screen !== 'undefined' ? screen.height : null
      });

      // Uncaught script errors. Capture phase so we also see errors from
      // <img>/<script>/<link> resource failures (ev.target.src on those).
      window.addEventListener('error', function (ev) {
        try {
          var src = ev.filename || (ev.target && ev.target.src) || '';
          pushLog({
            type: 'error',
            message: ev.message || (ev.error && String(ev.error)) || 'error',
            source: src,
            line: ev.lineno || 0,
            col: ev.colno || 0,
            stack: (ev.error && ev.error.stack) || ''
          });
        } catch (e) {}
      }, true);

      window.addEventListener('unhandledrejection', function (ev) {
        try {
          var reason = ev.reason;
          pushLog({
            type: 'rejection',
            message: (reason && reason.message) || String(reason || 'rejection'),
            stack: (reason && reason.stack) || ''
          });
        } catch (e) {}
      });

      // Wrap console methods. Original behavior preserved so devtools still
      // sees the real call; we additionally append a sanitized text record.
      var methods = ['log', 'warn', 'error'];
      for (var i = 0; i < methods.length; i++) {
        (function (m) {
          var orig = console[m];
          console[m] = function () {
            try {
              var args = Array.prototype.slice.call(arguments);
              var msg = '';
              for (var j = 0; j < args.length; j++) {
                var part;
                try {
                  part = typeof args[j] === 'string' ? args[j] : JSON.stringify(args[j]);
                } catch (e) {
                  part = String(args[j]);
                }
                msg += (j > 0 ? ' ' : '') + part;
              }
              if (msg.length > 1000) msg = msg.slice(0, 1000) + '...[trunc]';
              pushLog({ type: 'console.' + m, message: msg });
            } catch (e) {}
            try { return orig.apply(console, arguments); } catch (e) {}
          };
        })(methods[i]);
      }

      // Page-load timing relative to this script's execution.
      try {
        document.addEventListener('DOMContentLoaded', function () {
          pushLog({ type: 'timing', event: 'DOMContentLoaded', sinceInit: nowMs() - INIT_T });
        });
        window.addEventListener('load', function () {
          pushLog({ type: 'timing', event: 'load', sinceInit: nowMs() - INIT_T });
        });
      } catch (e) {}
    } catch (outerErr) {
      // If even init failed, the player must still boot. Do nothing.
    }
  })();
  </script>
  <!-- Debug overlay module (section 2). Defers so HTML parse doesn't block
       on the fetch. Auto-activation check fires after DOMContentLoaded;
       few-ms delay vs the inline trap is fine since errors before this
       loads are already captured in __debugLog by the inline trap above. -->
  <script src="/player/debug-overlay.js" defer></script>
  <!-- BrightSign bridge. NOT deferred: the player asks it who this device is and whether a
       restart can be delegated to the host, and both questions are asked during boot. Off
       BrightSign every method is a no-op, so this is inert in a browser. -->
  <script src="/player/st-bridge.js"></script>
  <!-- BrightSign native sync (SyncManager). Inert without the platform module, so the player
       falls back to its own clock-derived group sync. -->
  <script src="/player/st-sync.js"></script>
  <title>ScreenTinker Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /*
     * ONE KNOB for every pre-playback screen (setup, pairing, status, the audio prompt).
     *
     * A signage panel is read from across a room, so the thing that has to stay constant is
     * ANGULAR size, not pixel size — and a CSS pixel covers a quarter of the screen area on a 4K
     * panel that it does on 1080p, a sixteenth on 8K. A 72px pairing code that fills the wall on a
     * 1080p screen is a smudge on an 8K one, which is exactly the complaint this fixes.
     *
     * So every size on those screens is a rem against this root: 1rem = 10px at 1080p, 20px at 4K,
     * 40px at 8K — the same apparent size at the same viewing distance, at any panel resolution.
     *
     * vmin rather than vw, because portrait-mounted panels are common here and vw would render a
     * 1080x1920 screen at half size. Clamped at both ends so a dashboard preview iframe or a
     * laptop window stays legible instead of microscopic, and an ultrawide does not get silly.
     *
     * Nothing outside these screens uses rem, so this cannot reach playback content — zones,
     * images and video are laid out in % and px by the layout engine and are untouched.
     */
    html { font-size: clamp(7px, 0.926vmin, 56px); }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }

    /* Setup Screen */
    #setupScreen {
      position: fixed; inset: 0; background: #111827; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 1000; color: #f1f5f9;
    }
    #setupScreen h1 { font-size: 3.6rem; color: #3b82f6; margin-bottom: 0.8rem; }
    #setupScreen .subtitle { color: #94a3b8; font-size: 1.6rem; margin-bottom: 4.8rem; }
    #setupScreen .form { width: 40rem; max-width: 90vw; }
    #setupScreen label { display: block; font-size: 1.4rem; color: #94a3b8; margin-bottom: 0.8rem; }
    #setupScreen input { width: 100%; padding: 1.2rem; background: #0f172a; border: 0.1rem solid #334155;
      border-radius: 0.8rem; color: #f1f5f9; font-size: 1.6rem; margin-bottom: 2.4rem; outline: none; }
    #setupScreen input:focus { border-color: #3b82f6; }
    #setupScreen button { width: 100%; padding: 1.2rem; background: #3b82f6; color: white;
      border: none; border-radius: 0.8rem; font-size: 1.6rem; font-weight: 600; cursor: pointer; }
    #setupScreen button:hover { background: #2563eb; }
    #setupScreen button:disabled { opacity: 0.5; cursor: not-allowed; }
    /* The number someone is squinting at from the far side of a shop. It gets the most room the
       screen can give it, which is why it is the largest multiple here. */
    .pairing-code { font-size: 7.2rem; font-weight: 700; color: #3b82f6; font-family: monospace;
      letter-spacing: 1.2rem; margin: 2.4rem 0; }
    .pairing-hint { color: #64748b; font-size: 1.4rem; }
    .status-msg { color: #94a3b8; font-size: 1.4rem; margin-top: 1.6rem; }
    .spinner { width: 4rem; height: 4rem; border: 0.3rem solid #334155; border-top-color: #3b82f6;
      border-radius: 50%; animation: spin 1s linear infinite; margin: 2.4rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Player */
    #playerContainer { position: fixed; inset: 0; background: #000; }
    /* Fullscreen single-zone playback: YouTube's IFrame API measures the placeholder
       at construction time. If that happens before layout settles, YT bakes in a
       300x150 fallback as inline pixel dimensions on the iframe, which our %-based
       rules can't override. Force fullscreen via absolute positioning + !important. */
    #playerContainer > iframe,
    #playerContainer > div > iframe {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      border: none !important; display: block !important;
    }
    .zone { position: absolute; overflow: hidden; }
    .zone video { width: 100%; height: 100%; object-fit: cover; }
    .zone img { width: 100%; height: 100%; object-fit: cover; }
    .zone iframe { width: 100%; height: 100%; border: none; }

    /* Video wall mode.
       wall-stage maps the wall's player_rect into this device's viewport
       using vw/vh — so the device fills its full viewport edge-to-edge
       (no pillarbox at the seam between adjacent screens).
       object-fit:fill is intentional: it stretches the source to the stage,
       which keeps vertical position identical between devices that share
       a viewport height — without that, cover-cropping on different stage
       aspects (different innerWidths) shifts content vertically. */
    #playerContainer.wall-mode { overflow: hidden; background: #000; }
    .wall-stage { position: absolute; }
    .wall-stage > video,
    .wall-stage > img { width: 100%; height: 100%; object-fit: fill; display: block; }
    .wall-stage > iframe { width: 100%; height: 100%; border: none; display: block; }
    .wall-mode #playerContainer > iframe,
    .wall-mode #playerContainer > div > iframe { position: static !important; width: 100% !important; height: 100% !important; }

    /* #109: PiP overlay layer — a fixed full-viewport layer ABOVE #playerContainer that
       the playlist never touches. The same orientation transform is applied to it as to
       #playerContainer, so corner positions track the visible content in every orientation.
       Pointer-transparent and empty (invisible) until an overlay is shown. */
    #pipContainer { position: fixed; inset: 0; pointer-events: none; z-index: 9000; }
    /* ⚠️ Two owners share this layer: the manual PiP path and the trigger engine. Without an
       explicit stack, DOM insertion order decides who paints on top — so a PiP pushed during an
       alarm would cover the alarm. A trigger always outranks a PiP. */
    #pipContainer > .trigger-box { position: absolute; inset: 0; overflow: hidden; z-index: 2; }
    #pipContainer > .pip-box { position: absolute; overflow: hidden; box-sizing: border-box; box-shadow: 0 6px 28px rgba(0,0,0,0.55); z-index: 1; }
    #pipContainer > .pip-box > .pip-title { font: 600 16px sans-serif; padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #pipContainer > .pip-box > img,
    #pipContainer > .pip-box > iframe { display: block; width: 100%; border: 0; }

    /* Status overlay */
    #statusOverlay {
      position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #94a3b8; z-index: 500;
    }
    #statusOverlay h2 { color: #3b82f6; font-size: 2.8rem; margin-bottom: 0.8rem; }
    #statusOverlay p { font-size: 1.6rem; }
  </style>
</head>

    const PLAYER_LANG = (() => {
      const stored = localStorage.getItem('rd_lang');
      const detected = (stored || navigator.language || 'en').split('-')[0];
      return PLAYER_I18N[detected] ? detected : 'en';
    })();
    const _t = (k) => (PLAYER_I18N[PLAYER_LANG] && PLAYER_I18N[PLAYER_LANG][k]) || PLAYER_I18N.en[k] || k;

    // Apply translations to the static setup screen markup
    document.addEventListener('DOMContentLoaded', () => {
      const setSubtitle = document.querySelector('#setupScreen .subtitle');
      if (setSubtitle) setSubtitle.textContent = _t('web_player');
      const lblServer = document.querySelector('#urlForm label');
      if (lblServer) lblServer.textContent = _t('server_url');
      const inputServer = document.getElementById('serverUrl');
      if (inputServer) inputServer.placeholder = _t('server_url_placeholder');
      const connectBtn = document.getElementById('connectBtn');
      if (connectBtn) connectBtn.textContent = _t('connect');
      const pairingP = document.querySelector('#pairingSection p:first-child');
      if (pairingP) pairingP.textContent = _t('pairing_code');
      const pairingHint = document.querySelector('#pairingSection .pairing-hint');
      if (pairingHint) pairingHint.textContent = _t('pairing_hint');
      // Translate any element with data-i18n attribute
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (k) el.textContent = _t(k);
      });
    });

    // ==================== Config ====================
    // The BrightSign bridge, or null. Resolved before the storage keys because on a dual-output
    // player it decides what those keys are called.
    const BS = (typeof window !== 'undefined' && window.ScreenTinkerBS) || null;
    const ON_BRIGHTSIGN = !!(BS && BS.isBrightSign());

    // Per-output storage namespace. A dual-output BrightSign runs TWO widgets against one origin
    // and one SD storage_path, so they share localStorage: without this the second output reads
    // the first one's config and device id and the two collapse into a single device row. Empty
    // for screen 1 and for every other platform, so nothing existing moves.
    const SCREEN_SUFFIX = (() => {
      try { return BS ? (BS.storageSuffix() || '') : ''; } catch (e) { return ''; }
    })();

    const STORAGE_KEY = 'rd_web_player' + SCREEN_SUFFIX;
    const HEARTBEAT_INTERVAL = 15000;
    const PLAYLIST_REFRESH_INTERVAL = 60000;
    // #104: device-free dashboard preview mode (set by the ?preview=1 boot branch).
    // Gates the webpage-widget honest note and keeps the pairing/socket path off.
    let PREVIEW_MODE = false;

    // Restarting the player — the only way any call site should do it.
    //
    // On BrightSign a page-initiated location.reload() does not reliably bring the roHtmlWidget
    // back: a deploy on 2026-07-28 reloaded every connected player, and the BrightSign was the
    // only one that never returned, while a browser on the same deploy was heartbeating minutes
    // later. autorun.brs rebuilds the widget instead, which is a restart the OS actually
    // performs.
    //
    // Falls through to reload() whenever the host isn't there to take the request — a browser, or
    // a widget built without nodejs_enabled — so a caller is never left with nothing done.
    function restartPlayer(reason) {
      try {
        if (BS && BS.hasHost() && BS.restart(reason)) {
          console.log('[bs] restart delegated to host:', reason);
          return;
        }
      } catch (e) { /* a broken bridge must not strand the player */ }
      location.reload();
    }

    /*
     * #313 — the enrolment key from the URL, for players whose storage does not come back.
     *
     * A vMix browser input deletes its whole CEF profile when vMix closes, so localStorage,
     * cookies and IndexedDB all vanish together and this player boots with nothing but its URL.
     * Without an identity it would pair as a NEW display every restart, leaving the operator a
     * dashboard full of dead screens. `?k=` is the identity that survives, because the URL is the
     * one thing vMix does keep.
     *
     * Read once, here, so every caller of getConfig() sees it — including the boot path that
     * decides whether we are paired.
     */
    function urlEnrolKey() {
      try { return new URLSearchParams(location.search).get('k') || null; } catch (e) { return null; }
    }

    function getConfig() {
      let cfg = {};
      try { cfg = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { cfg = {}; }
      // On BrightSign localStorage is bound to the page origin and its quota; the registry is
      // not. When local storage comes back empty but the registry still knows who we are, adopt
      // that identity instead of re-pairing — otherwise a provisioned panel spawns a second
      // device row, which is the same duplicate-row failure the hardware-only fingerprint caused.
      if (BS && !cfg.deviceId) {
        try {
          const known = BS.deviceId();
          if (known) {
            cfg.deviceId = known;

    /*

     * The revision is in the URL on purpose. Media is cached for offline playback keyed by URL, and
     * PUT /api/content/:id/replace changes an asset's BYTES without changing its id — so without a
     * revision a replaced asset would keep playing the old copy on every panel that already held

     * everything and on a marginal one is nothing: a large asset never finishes in one go, so the
     * panel is left with an empty cache exactly where it needs a full one. Handing it the list lets
     * it fetch in resumable chunks, on its own schedule, instead of racing the video that is
     * currently playing for the same scarce bandwidth.
     *
     * Best-effort by construction: no service worker (an insecure origin, an older BrightSign
     * build) simply means no prefetch, and playback is unchanged.
     */

     * @param items     the base playlist
     * @param extraItems content that must ALSO survive, currently the assigned triggers' playlists
     *
     * ⚠️ extraItems IS NOT OPTIONAL POLISH. `urls` is declared to the worker as the COMPLETE set for
     * this display, and pruneToPlaylist() deletes everything else in the content cache. So a trigger
     * target left out of this list is not merely un-prefetched — it is actively DELETED, and the

        // the content cache as superseded. That is what reclaims a replaced asset: a replace writes
        // a new randomly-named file, so the old copy is not merely a different revision of the same
        // URL — it is a different URL entirely, and nothing keyed on the asset path can find it.
        sw.postMessage({ type: 'st-cache-playlist', urls, prune: true });

         * ⚠️ AND WARM EACH BUNDLE'S RENDER, because the archive alone is not playable.
         *
         * The loop above pins /uploads/content/<file> — for a bundle that is the .zip, which

         * document at /api/content/:id/bundle, a different URL the worker only sees once something
         * asks for it. Without this warm-up the first play of a bundle after an outage begins is a

         */
        for (const it of all) {

    const TRIGGERS_CACHE_KEY = 'rd_triggers_cache' + SCREEN_SUFFIX;

    let triggers = loadTriggersCache();

     *
     * The signature covers what changes behaviour — tokens, mode, timing, priority, and the identity
     * and order of the target items — so an edit to a trigger's playlist re-pins and re-syncs, while
     * a payload that merely rebuilt the same values is not a change.
     */
    function triggersSig(list) {

        t.id, t.match_token, t.clear_token || '', t.mode, t.priority || 0,
        t.max_duration_sec || 0, t.lease_sec == null ? '' : t.lease_sec,
        t.source_http ? 'h' : '', t.source_udp ? 'u' : '',
        // `position` is deliberately absent: it is not projected to the device and changes
        // nothing on screen, so including it would force a full re-sync AND (since the re-pin
        // fix) a prune-and-re-pin of every asset, for an edit with no visible effect.
        t.target_kind || '', t.target_ref || '',
        /*
         * ⚠️ IDENTITY *AND* BYTES. Keying on content_id alone made this blind to the one edit that
         * silently breaks an asset: PUT /api/content/:id/replace KEEPS the id and writes a new
         * random filepath. Identical signature -> triggers never re-adopted -> no re-pin, and the
         * cached array still holds the DEAD filepath, which is what both pin calls keep pinning.
         * The trigger then fires against a 404 on the day the WAN is down.
         */
        (t.items || []).map((i) => (i ? `${i.content_id || i.widget_id || ''}:${i.filepath || ''}` : '')).join('+'),

      return out;
    }

    function saveLayoutCache(l) {
      try { localStorage.setItem(LAYOUT_CACHE_KEY, JSON.stringify(l || null)); } catch {}
    }

      try { return JSON.parse(localStorage.getItem(LAYOUT_CACHE_KEY) || 'null'); } catch { return null; }

    // (degrade-safe — an ack-less server never arms us); lastServerMessageAt refreshes on ANY
    // inbound (the SILENCE check) while ARMING gates on the ack. Backoff (1s→30s ±20%) is on the
    // socket.io Manager (io opts below). NO status/health poll — load is read from ack-silence.
    // Browser-specific half-open triggers (visibility/resume/online) drive the SAME check + the
    // #148 teardown-first reconnect — additional triggers, not a separate mechanism.
    // ST_PLAYER_VERSION — stamped at SERVE time by the /player route from the repo VERSION, the
    // same trick autorun.brs uses for its package version. It was a hardcoded '1.1.0-web' that
    // nobody bumped for the whole 1.x line, so every web, Tizen and BrightSign panel in the fleet
    // reported a version three years stale as its client_version. Do not edit by hand.
    //
    // No '-web' suffix: client_version is only ever compared for EQUALITY (server/lib/liveness.js),
    // but a X.Y.Z-web string is a semver PRERELEASE and sorts BELOW X.Y.Z, so the moment anything
    // orders it the value would read as older than the release it came from.
    const PLAYER_VERSION = '1.1.0-web';
    const V4_THRESHOLD_BASE_MS = 45000, V4_THRESHOLD_JITTER_MS = 10000;
    function v4ThresholdMs(rand) { return V4_THRESHOLD_BASE_MS + Math.round((rand - 0.5) * 2 * V4_THRESHOLD_JITTER_MS); }
    // Wall-clock (Date.now) so silence COUNTS sleep/background time — the browser half-open causes
    // (a setInterval tick alone would be throttled/frozen in a hidden tab and undercount).
    let lastServerMessageAt = 0;
    let livenessConfirmed = false;
    let livenessWindowMs = V4_THRESHOLD_BASE_MS;
    let watchdogTimer = null;
    function markAlive() { lastServerMessageAt = Date.now(); }   // ANY inbound refreshes silence (does NOT arm)
    // Pure decision (matches the APK/.wgt watchdogShouldReconnect): reconnect only a connected +
    // registered socket whose liveness we've ARMED that has gone silent past the jittered window.
    function watchdogShouldReconnect(hasSocket, connected, armed, silentMs, windowMs) {
      return !!(hasSocket && connected && armed && silentMs > windowMs);
    }
    function checkLiveness() {
      // THROTTLE-AWARE. (1) Silence is computed by TIMESTAMP (now - lastServerMessageAt), never by
      // timer-fire-count, so a background-THROTTLED/late timer still measures the ACTUAL elapsed
      // silence — it won't miss a real half-open for firing late, nor false-fire for firing late.
      // (2) While the tab is HIDDEN, timers are throttled and the gap is EXPECTED — do NOT act on it
      // (never reconnect a backgrounded tab). The hidden->visible transition resets the grace via
      // verifyLivenessSoon(), so we don't false-fire on resume either.
      if (document.visibilityState !== 'visible') return;
      const silentMs = lastServerMessageAt ? (Date.now() - lastServerMessageAt) : 0;
      if (watchdogShouldReconnect(!!socket, !!(socket && socket.connected), livenessConfirmed, silentMs, livenessWindowMs)) {
        console.log('[v4] half-open (silent ' + silentMs + 'ms > ' + livenessWindowMs + ') — teardown+reconnect');
        connect(config.serverUrl);   // #148 teardown-before-reopen: connect() disconnects the old socket first
      }
    }
    // Fresh liveness check for a resume / bfcache-restore / network-change: silence accumulated
    // while hidden or throttled is NOT trustworthy, so NEVER tear down a possibly-live socket on it.
    // Reset the grace so the socket gets a fresh window to prove itself — a live socket's engine
    // ping/ack refreshes silence within the window (no reconnect); a genuinely dead one stays silent
    // past the window and the (now-visible) watchdog reconnects it. #148 teardown-first via connect().
    function verifyLivenessSoon() {
      lastServerMessageAt = Date.now();          // fresh grace — don't false-fire on stale hidden-silence
      if (!socket) { connect(config.serverUrl); return; }   // never connected / torn down -> establish
      // socket connected -> grace reset above; the watchdog verifies over the next window.
      // socket present-but-DISCONNECTED used to be left to "socket.io's own reconnection", which is
      // wrong for the disconnects socket.io does not retry ('io server disconnect'). A resume is
      // exactly when a stranded panel should get another go, so hand it to the supervisor.
      if (!socket.connected) {
        if (!disconnectedSinceMs) disconnectedSinceMs = Date.now();
        startReconnectSupervisor();
      }
    }
    function startWatchdog() { stopWatchdog(); watchdogTimer = setInterval(checkLiveness, 10000); }
    function stopWatchdog() { if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; } }

    // ---- Reconnect supervisor -------------------------------------------------------------
    // The watchdog above only covers a HALF-OPEN socket — one that still claims to be connected
    // while the server has gone quiet. It cannot help once a socket is known to be down, because
    // the disconnect handler stops it. That left a gap: socket.io retries most disconnects, but on
    // 'io server disconnect' it deliberately stands down, and on an explicit client teardown it
    // must not retry. So a server-closed socket had NOTHING watching it and the player stayed
    // down until a human reloaded the page — which is what stranded a live panel.
    //
    // This supervisor is the backstop for exactly that. It only ever re-establishes a socket that
    // is genuinely not connected, and it waits out a grace period first so socket.io's own
    // reconnection (1s backing off to 30s) gets to do the job on the disconnects it does own.
    let reconnectSupervisorTimer = null;
    let disconnectedSinceMs = 0;
    const RECONNECT_SUPERVISOR_TICK_MS = 15000;
    const RECONNECT_GRACE_MS = 45000;   // > socket.io's 30s max backoff, so we never race it

    // 'io client disconnect' is OUR OWN teardown (connect() closes the previous socket before
    // opening the next). Supervising that would fight the reconnect already in progress.
    function shouldSuperviseReconnect(reason) { return reason !== 'io client disconnect'; }

    // Pure decision, mirroring watchdogShouldReconnect: re-establish only a socket that is really
    // down and has stayed down past the grace period.
    function shouldForceReconnect(connected, sinceMs, nowMs, graceMs) {
      if (connected) return false;
      if (!sinceMs) return false;
      return (nowMs - sinceMs) >= graceMs;
    }

    function startReconnectSupervisor() {
      if (reconnectSupervisorTimer) return;
      reconnectSupervisorTimer = setInterval(() => {
        if (PREVIEW_MODE) return;
        if (socket && socket.connected) { stopReconnectSupervisor(); return; }
        if (!shouldForceReconnect(!!(socket && socket.connected), disconnectedSinceMs, Date.now(), RECONNECT_GRACE_MS)) return;
        console.warn('[reconnect] socket still down after ' + Math.round((Date.now() - disconnectedSinceMs) / 1000) + 's — re-establishing');
        disconnectedSinceMs = Date.now();          // restart the grace so we retry on a cadence, not a spin
        connect(config.serverUrl);                 // #148 teardown-before-reopen
      }, RECONNECT_SUPERVISOR_TICK_MS);
    }
    function stopReconnectSupervisor() {
      if (reconnectSupervisorTimer) { clearInterval(reconnectSupervisorTimer); reconnectSupervisorTimer = null; }
      disconnectedSinceMs = 0;
    }
    function browserPlatform() {
      try {
        const m = navigator.userAgent.match(/(Edg|OPR|Chrome|Firefox|Version)\/(\d+)/);
        if (m) { const name = { Edg: 'Edge', OPR: 'Opera', Version: 'Safari' }[m[1]] || m[1]; return name + ' ' + m[2]; }
        return 'Browser';
      } catch (e) { return 'Browser'; }
    }
    if (typeof window !== 'undefined') { window.__v4ThresholdMs = v4ThresholdMs; window.__v4WatchdogShouldReconnect = watchdogShouldReconnect; }

    // ==================== Socket Connection ====================
    function connect(serverUrl) {
      // BrightSign's registry is ASYNCHRONOUS (registry.read returns a Promise), so on a cold
      // boot the identity is not in hand yet when this first runs. Registering before it lands
      // would pair the panel as a NEW display and strand its real row — so wait once, then adopt
      // whatever the registry knows and carry on. onReady always fires (success, failure, or a
      // 5s cap inside the bridge), so this can defer boot but never block it.
      if (BS && !BS.isReady()) {
        BS.onReady(() => {
          try {
            const known = BS.deviceId();
            if (known && !config.deviceId) {
              config.deviceId = known;
              const tok = BS.deviceToken();
              if (tok) config.deviceToken = tok;
              config.paired = true;
              console.log('[bs] adopted identity from registry:', known, tok ? '(with token)' : '(NO TOKEN — will re-pair)');
            }
          } catch (e) { /* carry on unpaired rather than not at all */ }
          connect(serverUrl);
        });
        return;
      }

      if (socket) { socket.disconnect(); socket = null; }

      socket = io(serverUrl + '/device', {
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000,       // v4 canonical: 1s start (was 2s)
        reconnectionDelayMax: 30000,   // v4 canonical: 30s cap, within the ~30-60s band (was 10s)
        randomizationFactor: 0.2,      // v4 canonical: ±20% jitter (was the socket.io 0.5 default)
        timeout: 20000,
        // Prefer WebSocket but allow polling fallback. Socket.IO default is
        // polling-first with an upgrade dance that's fragile on TV WebKits
        // (LG webOS especially). Reversing the order opens a WebSocket directly;
        // if that fails (rare - blocked by firewall), it falls back to polling
        // on the same connect attempt. Tradeoff: WS-blocked networks add a few
        // seconds to first connect while WS times out. Worth it for the common
        // case where WS is fine but the upgrade dance was hanging the device.
        transports: ['websocket', 'polling'],
      });

      // v4 liveness: a fresh socket is assumed alive; DIS-arm until a heartbeat-ack re-arms; pick a
      // fresh jittered window for this connection. markAlive on ANY inbound (app events via onAny +
      // the engine ping) refreshes the SILENCE timer only — it does NOT arm.
      lastServerMessageAt = Date.now();
      livenessConfirmed = false;
      livenessWindowMs = v4ThresholdMs(Math.random());
      socket.onAny(markAlive);
      socket.io.on('ping', markAlive);

      /*
       * ⚠️ HONOUR device:throttled INSTEAD OF RECONNECTING INTO IT (#314).
       *
       * Three separate gates in ws/deviceSocket.js can refuse a register — the burst throttle, the
       * flap limiter and the session-settle hold — and all three refuse BEFORE the playlist is sent
       * and then drop the socket. Until now no player implemented this event at all: the server was
       * asking for a pause and the client came straight back on its 1s reconnect timer, so the
       * screen sat on "Waiting for content" with every byte of its content already cached, while
       * each retry re-tripped the rate window it was waiting out. Reported from a fleet after an
       * OTA, where the post-update relaunch cascade supplies the initial burst.
       *
       * So: take the server's own number, hold the reconnector off for that long, then come back
       * once. Clamped at both ends — a missing or absurd value must not strand a screen for hours,
       * and a zero must not turn this into a busy loop.
       */
      socket.on('device:throttled', (d) => {
        const asked = Number(d && d.retry_after_ms);
        const waitMs = Math.min(Math.max(Number.isFinite(asked) ? asked : 0, 1000), 5 * 60 * 1000);
        console.warn('[throttle] server asked us to wait ' + waitMs + 'ms (' + ((d && d.reason) || 'unspecified') + ')');
        try { socket.io.reconnection(false); } catch (e) { /* older client build */ }
        if (throttleHoldTimer) clearTimeout(throttleHoldTimer);
        throttleHoldTimer = setTimeout(() => {
          throttleHoldTimer = null;
          try {
            socket.io.reconnection(true);
            // The refusal came with a disconnect, so nothing is going to retry unless we ask.
            if (!socket.connected) socket.connect();
          } catch (e) { console.warn('[throttle] resume failed: ' + e.message); }
        }, waitMs);
      });
      // v4 degrade-safe ARM: the watchdog arms ONLY after the first app-level device:heartbeat-ack.
      socket.on('device:heartbeat-ack', (data) => { livenessConfirmed = true; if (data) ingestClockSample(data.server_ms, data.client_ms); });

      socket.on('connect', () => {
        console.log('Connected');
        stopReconnectSupervisor();   // back up; stand the backstop down
        register();
      });

      socket.on('disconnect', (reason) => {
        console.log('Disconnected', reason || '');
        stopHeartbeat();
        stopWatchdog(); // the watchdog is for HALF-OPEN only; a known-down socket is the supervisor's job
        // feat/offline-cause-log: open an offline gap so the next reconnect can report cause.
        if (!disconnectedAt) {
          disconnectedAt = Date.now();
          linkLostDuringGap = (typeof navigator !== 'undefined' && navigator.onLine === false);
        }
        // socket.io does NOT retry every disconnect. On 'io server disconnect' it deliberately
        // stands down and waits to be told to reconnect — so a server that closes a socket (a
        // handler throwing, a deploy, an eviction) left this player down FOREVER, with the
        // watchdog stopped above and nothing else watching. That happened to a real panel: it
        // sat dark until someone reloaded it by hand. Supervise every disconnect we did not
        // ourselves initiate.
        if (shouldSuperviseReconnect(reason)) {
          disconnectedSinceMs = Date.now();
          startReconnectSupervisor();
        }
      });

      socket.on('connect_error', (err) => {
        document.getElementById('setupStatus').textContent = 'Connection failed: ' + err.message;
        document.getElementById('setupSpinner').style.display = 'none';
        document.getElementById('connectBtn').disabled = false;
      });

      /* ============================ #299 offline proof-of-play ============================
       * Playback is offline-native; reporting was not. A play happening with the socket down used
       * to be discarded at the emit site, so an outage left a hole in play_logs that nothing could
       * ever fill. These keep it, and replay it with its REAL times once the socket is back.
       */
      let offlinePlayOpen = null;
      let offlinePlayFlushing = false;
      const OFFLINE_PLAY_KEY = 'st_offline_plays';
      const offlinePlays = new OfflinePlayQueue();
      try { offlinePlays.restore(localStorage.getItem(OFFLINE_PLAY_KEY)); } catch (e) { /* storage may be unavailable */ }
      if (offlinePlays.size()) console.log('[play] offline backlog restored:', offlinePlays.size());

      function persistOfflinePlays() {
        // ⚠️ A private-mode or quota-full localStorage must not take the player down; the backlog
        // is the expendable half here, playback is not.
        try { localStorage.setItem(OFFLINE_PLAY_KEY, offlinePlays.serialize()); } catch (e) { /* ignore */ }
      }

      function queueOfflinePlay(open, completed) {
        offlinePlays.add(OfflinePlayQueue.makePlay({
          client_event_id: OfflinePlayQueue.newId(),
          content_id: open.content_id,
          widget_id: open.widget_id,
          content_name: open.content_name,
          started_at: open.started_at,
          ended_at: Math.floor(Date.now() / 1000),
          completed: completed,
        }));
        persistOfflinePlays();
      }

      function flushOfflinePlays() {
        if (offlinePlayFlushing || !offlinePlays.size() || !socket?.connected) return;
        const batch = offlinePlays.peekBatch();
        if (!batch.length) return;
        offlinePlayFlushing = true;
        socket.emit('device:play-event', {
          device_id: config.deviceId,
          event: 'play_offline',
          plays: batch,
        });
        /*
         * ⚠️ Cleared only AFTER the server has had its say. Dropping at send time would turn a
         * flush into a dead socket back into exactly the silent loss this exists to stop. The ack
         * carries counts, so the ids acked are the ones just sent; a batch the server partly
         * rejected still clears, or one unusable entry would wedge the queue behind it forever.
         */
        setTimeout(() => {
          offlinePlays.ack(batch.map(p => p.client_event_id));
          persistOfflinePlays();
          offlinePlayFlushing = false;
          if (offlinePlays.size()) flushOfflinePlays();
        }, 4000);
        console.log('[play] flushed', batch.length, 'offline plays,', offlinePlays.size(), 'queued');
      }

      socket.on('device:play-offline-ack', (d) => {
        console.log('[play] backfill ack:', JSON.stringify(d));
      });

      /*
       * #trigger-ingress: a fire the SERVER accepted on our behalf.
       *
       * ⚠️ FOR PLAYERS THAT CANNOT OPEN THEIR OWN DOOR. BrightSign's server-on-a-player widget has
       * no Node, so `require('dgram')` and `require('http')` both throw here and the listeners
       * never bind — enabling triggers on such a device did nothing at all. The server on that same
       * board holds the door and hands the wire text over this socket instead.
       *
       * ⚠️ IT IS RE-EVALUATED HERE, NOT TRUSTED. The server resolved only WHICH device the payload
       * was addressed to; whether it may fire is decided by the same resolver a datagram would have
       * gone through, with this device's own secret. One decision, now three doors.
       */
      socket.on('device:trigger-wire', (d) => {
        try {
          if (!d || typeof d.text !== 'string') return;
          handleTrigger({ text: wireClean(d.text), source: d.source || 'server', sourceIp: d.sourceIp || 'server' });
        } catch (e) {
          triggerLog('warn', 'server-delivered trigger failed: ' + ((e && e.message) || e));
        }
      });

      socket.on('device:registered', (data) => {
        config.deviceId = data.device_id;
        if (data.device_token) config.deviceToken = data.device_token;
        saveConfig(config);
        console.log('Registered:', data.device_id);
        flushOfflinePlays();   // #299: authenticated, so any offline backlog can be replayed

        // feat/offline-cause-log: reconnected after an in-session disconnect -> report the gap length
        // + whether the local link dropped. cold_start:false because the page SURVIVED the gap (a
        // reboot/reload would have reset disconnectedAt). Browser has no SSID/RSSI to add.
        if (disconnectedAt && config.deviceId) {
          try {
            socket.emit('device:connectivity-report', {
              device_id: config.deviceId,
              offline_ms: Math.max(0, Date.now() - disconnectedAt),
              link_lost: linkLostDuringGap,
              cold_start: false,
            });
          } catch (e) {}
          disconnectedAt = 0; linkLostDuringGap = false;
        }

        if (!config.paired) {
          // Show pairing code
          document.getElementById('urlForm').style.display = 'none';
          document.getElementById('setupSpinner').style.display = 'none';
          document.getElementById('pairingSection').style.display = 'block';
          document.getElementById('pairingCode').textContent = config.pairingCode || '------';
          document.getElementById('setupStatus').textContent = '';
        }

        startHeartbeat();
        startWatchdog(); // v4: arm-gated half-open watchdog (no-op until a heartbeat-ack arms it)
        startPlaylistRefresh();
        startVersionCheck();
        // After the socket is up, because these forward to the SERVER — wiring them earlier would
        // drop the host's boot report on the floor rather than delivering it late.
        wireHostDiagnostics();
      });

      socket.on('device:paired', (data) => {
        config.paired = true;
        config.deviceName = data.name;
        saveConfig(config);
        console.log('Paired as:', data.name);
        document.getElementById('setupScreen').style.display = 'none';
        // #146 fix: the server re-emits device:paired on EVERY re-register of an already-
        // paired device (deviceSocket.js), i.e. on every reconnect — while content is already
        // playing. Showing the idle "Waiting for content..." overlay unconditionally covered
        // the live video (audio kept playing underneath) and the subsequent "Playlist
        // unchanged" left it up. Only fall to idle when nothing is actually playing.
        // Guard the METHOD, not just the object: a device running a stale-cached
        // player-media-health.js (older module, no shouldShowIdle) would otherwise throw
        // "shouldShowIdle is not a function" here and abort the rest of this handler. The
        // !isPlaying fallback is equivalent for the playing case (playing -> not idle).
        const PMH = window.PlayerMediaHealth;
        const showIdle = (PMH && typeof PMH.shouldShowIdle === 'function')
          ? PMH.shouldShowIdle({ isPlaying: isPlaying, hasContent: playlist.length > 0 })
          : !isPlaying;
        if (showIdle) showStatus('Waiting for content...');
      });

      // Server no longer accepts our identity (row deleted, or token rejected). Drop the
      // stale credentials and get a NEW pairing code on screen without anyone touching the
      // panel: config.serverUrl is known-good — we are talking to that server right now —
      // so there is nothing for a human to re-enter. The old code showed the URL form and
      // HID the pairing section, which on a screen-only display is a dead end: it asks for
      // typing that cannot happen, and hides the one thing that would rescue it. Recovery
      // then needed a physical reload. The Android player already does this correctly
      // (ProvisioningActivity "repair mode"); this brings the web player in line.
      function enterRepairMode(message) {
        delete config.deviceId;
        delete config.deviceToken;
        config.paired = false;
        saveConfig(config);
        document.getElementById('setupScreen').style.display = 'flex';
        document.getElementById('urlForm').style.display = 'block';   // still editable
        document.getElementById('pairingSection').style.display = 'none'; // until a code arrives
        document.getElementById('setupStatus').textContent = message;
        // Reconnecting re-registers with no device_id, so the server issues a fresh pairing
        // code and the device:registered handler reveals pairingSection.
        startAutoContinue(10);
      }

      socket.on('device:unpaired', () => {
        console.warn('Device not found on server — clearing credentials');
        savePlaylistCache([]);
        enterRepairMode('Device was removed from the server. Re-pairing…');
      });



      socket.on('device:auth-error', (data) => {
        /*
         * ⚠️ A DEAD ENROLMENT KEY HAS TO BE DROPPED, OR THE DISPLAY LOOPS FOREVER.
         *
         * The key is re-derived from location.search on every load, and carrying one sets
         * paired=true — so a player whose key was rolled, revoked, or whose display row was deleted
         * keeps presenting the same dead credential, never asks for a pairing code, and never shows
         * one. Repair mode does not help by itself: it clears deviceId and deviceToken and leaves
         * the key exactly where it was. Without this the only recovery is editing the URL on the
         * machine — which, for the vMix case this feature exists to serve, means editing the vMix
         * input by hand.
         *
         * The server names this case (reason: 'enrol_key_unknown'), so forget the key for this
         * session and go back to being unpaired: the next register asks for a pairing code and puts
         * it on the screen. The URL is left alone, because the operator may roll a NEW key onto this
         * same display and that URL should keep working.
         */
        if (data && data.reason === 'enrol_key_unknown') {
          console.warn('[enrol] this player URL key is no longer valid — falling back to pairing');
          config.enrolKey = null;
          config.paired = false;
        }

        console.warn('Device auth rejected:', data?.error || 'unknown');
        enterRepairMode('This device needs to be re-paired. Getting a new code…');
      });

      socket.on('device:playlist-update', (data) => {
        console.log('Playlist update:', data.assignments?.length, 'items');
        handlePlaylistUpdate(data);
      });

      // Video wall sync (leader broadcasts; followers align)
      socket.on('wall:sync', (data) => {
        if (!wallConfig || wallConfig.is_leader) return;
        if (data.wall_id !== wallConfig.wall_id) return;
        lastWallSync = data;
        // If leader switched item, jump to it
        if (typeof data.current_index === 'number' && data.current_index !== currentIndex && playlist.length > 0) {
          currentIndex = ((data.current_index % playlist.length) + playlist.length) % playlist.length;
          playCurrentItem();
        }
        // Hold the follower close to the leader's clock. Account for relay
        // latency: the leader was at position_sec when sent_at was stamped;
        // by now a bit more time has elapsed, so target = position + latency.
        if (currentVideoEl && typeof data.position_sec === 'number') {
          const now = Date.now();
          const latency = data.sent_at ? Math.max(0, (now - data.sent_at) / 1000) : 0;
          const target = data.position_sec + latency;
          const drift = (currentVideoEl.currentTime || 0) - target;
          const absDrift = Math.abs(drift);
          if (absDrift > 0.3 && isFinite(currentVideoEl.duration) && target < currentVideoEl.duration) {
            // Big drift: hard seek and reset rate.
            try { currentVideoEl.currentTime = target; } catch (_) {}
            try { currentVideoEl.playbackRate = 1.0; } catch (_) {}
          } else if (absDrift > 0.05) {
            // Small drift: nudge playbackRate to converge gently. ±3% is
            // imperceptible on most content but pulls in 50ms drift in <2s.
            try { currentVideoEl.playbackRate = drift > 0 ? 0.97 : 1.03; } catch (_) {}
          } else if (currentVideoEl.playbackRate !== 1.0) {
            // In-window: ride at normal rate.
            try { currentVideoEl.playbackRate = 1.0; } catch (_) {}
          }
        }
      });

      // Leader receives a sync-request from a (re)connecting follower and
      // immediately broadcasts its position so the requester can align without
      // waiting for the next periodic tick.
      socket.on('wall:sync-request', (data) => {
        if (!wallConfig?.is_leader) return;
        if (data?.wall_id && data.wall_id !== wallConfig.wall_id) return;
        console.log('[wall] sync-request received from ' + data?.requested_by + ', broadcasting current position');
        emitWallSync();
      });

      // #group-sync: index+position are computed LOCALLY from the disciplined clock + the shared
      // schedule (see groupScheduleTick). There is deliberately NO leader and NO server relay of
      // positions — every member derives the same tick from the same clock, so sync survives an
      // internet outage and there is no leader to go split-brain. The server only (a) disciplines
      // the clock via the heartbeat-ack and (b) can nudge an immediate re-align on demand:
      socket.on('group:resync', (data) => {
        if (!groupSync) return;
        if (data?.group_id && data.group_id !== groupSync.group_id) return;
        groupReport('info', 'manual resync requested');
        groupScheduleTick();   // recompute + snap to the schedule target right now
      });

      socket.on('device:screenshot-request', () => { console.log('Screenshot requested'); captureAndSend(); });
      socket.on('device:remote-start', () => { console.log('Remote start received'); remoteStreaming = true; startStreaming(); });
      socket.on('device:remote-stop', () => { console.log('Remote stop received'); remoteStreaming = false; stopStreaming(); });

      socket.on('device:remote-touch', (data) => {
        // Simulate click at normalized coordinates within the player
        const container = document.getElementById('playerContainer');
        if (!container) return;
        const x = data.x * container.offsetWidth;
        const y = data.y * container.offsetHeight;
        const el = document.elementFromPoint(x, y);
        if (el) el.click();
        console.log('Touch:', data.x, data.y, '-> element:', el?.tagName);
      });

      socket.on('device:remote-key', (data) => {
        console.log('Key:', data.keycode);
        const video = document.querySelector('#playerContainer video');
        switch (data.keycode) {
          case 'KEYCODE_DPAD_RIGHT':
            // Skip to next content
            nextItem();
            break;
          case 'KEYCODE_DPAD_LEFT':
            // Go to previous content
            currentIndex = (currentIndex - 2 + playlist.length) % playlist.length;
            nextItem();
            break;
          case 'KEYCODE_DPAD_CENTER':
          case 'KEYCODE_ENTER':
            // Toggle play/pause
            if (video) { video.paused ? video.play() : video.pause(); }
            break;
          case 'KEYCODE_VOLUME_UP':
            // Wall followers ignore volume changes — they stay silent.
            // baseAudioSuppressed: a volume key must not un-silence the base under a live alarm.
            // There is no play() after this write, so the 'play' capture net would never correct it.
            if (video && !isWallFollower() && !baseAudioSuppressed) { video.volume = Math.min(1, video.volume + 0.1); video.muted = false; }
            break;
          case 'KEYCODE_VOLUME_DOWN':
            if (video) { video.volume = Math.max(0, video.volume - 0.1); }
            break;
          case 'KEYCODE_MENU':
            // Toggle mute (followers can't unmute)
            if (video && !baseAudioSuppressed && !(isWallFollower() && video.muted)) { video.muted = !video.muted; }
            break;
          case 'KEYCODE_HOME':
            // Go back to first item
            currentIndex = -1;
            nextItem();
            break;
          case 'KEYCODE_BACK':
            // Show/hide status overlay with device info
            const overlay = document.getElementById('infoOverlay');
            if (overlay) { overlay.style.display = overlay.style.display === 'none' ? 'flex' : 'none'; }
            break;
          case 'KEYCODE_POWER':
            // Toggle screen (show black overlay)
            toggleScreenOff();
            break;
        }
      });

      socket.on('device:command', (data) => {
        console.log('Command:', data.type);
        if (data.type === 'refresh') restartPlayer('operator refresh');
        if (data.type === 'launch') { document.getElementById('screenOffOverlay')?.remove(); screenIsOff = false; suppressMedia(false); setDisplayPower(true); }
        if (data.type === 'screen_off') toggleScreenOff();
        if (data.type === 'screen_on') { document.getElementById('screenOffOverlay')?.remove(); screenIsOff = false; suppressMedia(false); setDisplayPower(true); }
        // A browser tab cannot reboot its host, so the web player has always ignored this and the
        // dashboard button did nothing on it. A BrightSign can, through the host script.
        if (data.type === 'reboot') {
          if (BS && BS.reboot()) console.log('[bs] reboot requested via host');
          else console.log('reboot: not supported on this player');
        }
        // Media volume. Applies to whatever is playing now and is remembered for items mounted
        // later (see setMediaVolume). The wire parsing is volumeLevelFromCommand().
        if (data.type === 'set_volume') {
          const v = volumeLevelFromCommand(data);
          if (v === null) console.warn('[volume] set_volume with no usable level/value:', JSON.stringify(data));
          else setMediaVolume(v);
        }
        // The dashboard's "Debug logging" checkbox. Accepts the flag at either depth: the command
        // relay wraps it in `payload`, but the queued-command replay path and the public API have
        // both been seen to deliver it flat.
        if (data.type === 'set_debug') setRemoteDebug(!!(data.payload?.enabled ?? data.enabled));
      });

      // #129: real-time mute. Apply immediately if the toggled item is the one playing now;
      // the value is also persisted in the snapshot so it sticks on the next playlist load.
      socket.on('device:mute-changed', (data) => {
        const item = playlist[currentIndex];
        if (data && item && data.content_id && item.content_id === data.content_id && currentVideoEl) {
          // Was `<video>`-only, so a YouTube item ignored the toggle entirely.
          remoteMuteOverride = !!data.muted;
          applyMute();
          // currentVideoEl is the BASE surface by definition. applyMute has already resolved the
          // right value (and honours suppression); writing data.muted straight in would let an
          // operator's un-mute punch through a live overlay's silence.
          try { currentVideoEl.muted = !!data.muted || baseAudioSuppressed; } catch (_) {}
        }
      });

      // #109: PiP overlay — a pushed floating layer above the playlist. The player
      // fetches uri itself (same trust model as remote_url content).
      socket.on('device:pip-show', (data) => pipShow(data));
      socket.on('device:pip-clear', (data) => pipClear(data && data.pip_id));
    }

    // ==================== Triggers (docs/triggers-design.md) ====================
    /*
     * Externally-fired interrupt content, resolved HERE and nowhere else.
     *
     * ⚠️ The fire path never contacts the hub. Definitions arrived at sync time and are cached in
     * localStorage; the target playlist's media is pinned by the same message that pins the base
     * playlist. With the WAN down every part of this still works, which is the entire feature.
     *
     * ⚠️ A fire is NOT last-wins. Highest priority wins, ties go to the last arrival, and a
     * preempted `until_cleared` trigger is HELD and restored when the winner clears — see
     * triggerPromote and the lease sweep below. (This comment used to describe the step-4 state
     * and said the opposite of the code directly beneath it, which is worse than no comment.)
     *
     * Base audio: while a trigger COVERS the screen the base playlist is silenced. That is derived
     * from triggerActive.coversBase via triggerSyncAudio, never from `triggerActive !== null` — a
     * trigger that covers only part of the screen leaves the base visible, and silencing it then
     * would be wrong.
     */
    let triggerActive = null;                 // { trigger, mode, since, source, leaseUntil }
    let triggerTimers = {};                   // its OWN store — clearZoneTimers() must not reach it
    let triggerCapTimer = null;
    /*
     * ⚠️ HELD, NOT STACKED. Only `until_cleared` triggers survive being preempted, because they are
     * assertions about the world that nobody has retracted — "room occupied" is still true while
     * "evacuate" covers it. A preempted `once` is NOT held: its moment has passed, and showing it
     * later would put stale content on a screen at a time nobody chose.
     *
     * That distinction is what stops this being an interrupt stack. A stack accumulates expired
     * one-shots and needs eviction rules nobody gets right; this holds only the things that are
     * still true and drops them the moment they stop being true (cleared, or lease expired).
     */
    let triggerHeld = [];                     // [{ trigger, source, leaseUntil }]
    let triggerLeaseTimer = null;
    const triggerStats = {
      received: 0, accepted: 0,
      rejected: { bad_magic: 0, malformed: 0, bad_secret: 0, unknown_token: 0, too_large: 0, rate_limited: 0 },
      last_datagram_at: null, listeners: {},
    };
    const triggerLimiter = window.TriggerResolve
      ? window.TriggerResolve.createRateLimiter({ perSec: 5, burst: 10, globalPerSec: 50 })
      : null;
    /* ⚠️ One line per reason per window. A packet flood must not become a log flood — the same
     * lesson as the [content-ack] shedding fix. */
    const triggerLogged = {};
    function triggerLog(level, msg, key) {
      if (key) {
        const now = Date.now();
        if (triggerLogged[key] && now - triggerLogged[key] < 10000) return;
        triggerLogged[key] = now;
      }
      try { window.__debugLog_push && window.__debugLog_push({ type: 'trigger', level, msg }); } catch (e) {}
      try { console[level === 'warn' ? 'warn' : 'log']('[trigger] ' + msg); } catch (e) {}
      try {
        if (socket?.connected && config.deviceId) {
          socket.emit('device:log', { device_id: config.deviceId, tag: 'trigger', level, message: msg });
        }
      } catch (e) {}
    }

    /** When this trigger's hold lapses if nobody re-asserts it. null = hold indefinitely. */
    function triggerLeaseUntil(trigger) {
      const secs = Number(trigger && trigger.lease_sec);
      return Number.isFinite(secs) && secs > 0 ? Date.now() + secs * 1000 : null;
    }

    /*
     * ⚠️ THE LEASE TICKS WHILE A TRIGGER IS HELD, not only while it is on screen.
     *
     * The lease answers "is this condition still true", which is a question about the world, not
     * about the display. A held trigger whose sender stopped talking has stopped being true, and if
     * it were allowed to survive on the held list it would pop back the moment the higher-priority
     * overlay cleared — reasserting a condition that lapsed minutes ago. So the sweep covers both.
     */
    function triggerLeaseSweep() {
      const now = Date.now();
      if (triggerActive && triggerActive.leaseUntil && now > triggerActive.leaseUntil) {
        const name = triggerActive.trigger.name;
        triggerStop('lease expired');
        triggerLog('warn', `lease expired, auto-cleared "${name}"`);
        triggerPromote();
        return;
      }
      const before = triggerHeld.length;
      triggerHeld = triggerHeld.filter((h) => !(h.leaseUntil && now > h.leaseUntil));
      if (triggerHeld.length !== before) {
        triggerLog('info', `${before - triggerHeld.length} held trigger(s) lapsed and were dropped`);
      }
    }

    /*
     * Bring back the highest-priority thing that is still true.
     *
     * ⚠️ It restarts at item 1 rather than resuming a position. A held trigger is a state assertion,
     * not a paused timeline: if "evacuate" was authored with the exit map first, resuming at item 4
     * makes the first three unreachable for as long as the preemption lasted. Resuming would also
     * mean per-trigger playback state surviving preemption — state that leaks, and that nobody
     * notices is wrong.
     */
    function triggerPromote() {
      if (triggerActive || !triggerHeld.length) return;
      // Highest priority; ties to the most recently held, which matches the last-arrival tie-break
      // used everywhere else in this handler.
      let best = 0;
      for (let i = 1; i < triggerHeld.length; i++) {
        if ((triggerHeld[i].trigger.priority || 0) >= (triggerHeld[best].trigger.priority || 0)) best = i;
      }
      const h = triggerHeld.splice(best, 1)[0];
      triggerLog('info', `restoring held "${h.trigger.name}" (still asserted)`);
      triggerFire(h.trigger, h.source, h.leaseUntil);
    }

    function triggerStop(reason) {
      try { if (triggerCapTimer) clearTimeout(triggerCapTimer); } catch (e) {}
      triggerCapTimer = null;
      for (const k in triggerTimers) { try { clearTimeout(triggerTimers[k]); } catch (e) {} }
      triggerTimers = {};
      const was = triggerActive;
      triggerActive = null;
      /*
       * ⚠️ REMOVE ONLY OUR OWN BOX. #pipContainer has TWO owners — this and the manual PiP path
       * (pipTeardown) — and both used to do `innerHTML = ''`, so each silently destroyed the
       * other's DOM while the other's state machine carried on believing it was on screen. The
       * dangerous direction was this one: wiping a live .pip-box here left pipTimer/pipCurrent
       * set, and that orphaned timer later fired pipClear() -> pipTeardown() and erased a live
       * emergency overlay, from a timer belonging to an overlay that no longer existed.
       *
       * The media teardown is not decoration: `innerHTML = ''` on a container holding a playing
       * <video> leaves it detached-but-DECODING, which is the #146 ghost-audio bug (see the fix
       * at the bottom of teardownCurrentMedia). Same three-line shape as the zone path.
       *
       * Deliberately inlined rather than shared with pipTeardown: three tests slice this file
       * textually and compile the region with `new Function`, so a helper declared outside the
       * slice would be a ReferenceError there.
       */
      /*
       * ⚠️ The whole removal is wrapped: triggerStop runs on the fire path (superseded), the
       * clear path and the lease sweep, and a throw here used to escape into the HTTP handler
       * and leave the response unsent — the sender hangs instead of getting an error. Clearing
       * an overlay must never be able to wedge the door that clears it.
       */
      try {
        const c = document.getElementById('pipContainer');
        if (c && c.querySelectorAll) c.querySelectorAll('.trigger-box').forEach((b) => {
          try {
            b.querySelectorAll('video').forEach((v) => {
              try { v.onended = null; v.onerror = null; v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
            });
          } catch (e) { /* no media in this box */ }
          try { b.remove(); } catch (e) {}
        });
      } catch (e) { try { console.warn('[trigger] overlay teardown failed: ' + e.message); } catch (e2) {} }
      /*
       * ⚠️ NOT on a supersede. triggerFire opens with triggerStop('superseded') and then syncs at
       * its own end, so syncing here too would drive the base true -> false -> true and let its
       * audio blip through the gap every time one trigger replaces another. The idempotence guard
       * in setBaseAudioSuppressed cannot absorb that, because the state genuinely changes twice.
       * On a supersede the caller is mid-transaction and owns the final sync; every other reason
       * (cleared, clear-all, lease expiry, duration cap) is a settled state and syncs here.
       */
      if (reason !== 'superseded') triggerSyncAudio();
      if (was) { triggerLog('info', `cleared "${was.trigger.name}" (${reason})`); reportTriggerStatus(); }
    }

    /*
     * ONE derived-state sync, called from triggerFire and triggerStop — not two imperative calls.
     *
     * ⚠️ triggerFire begins with triggerStop('superseded'), so a release-then-suppress pair would
     * un-mute the base for a tick on EVERY re-assert. Control gear re-asserts on a timer (Extron
     * has StartKeepAlive for precisely this, Q-SYS's own protocol expects traffic every 60s), so
     * that tick would recur every few seconds for the whole duration of an alarm. Deriving the
     * state instead, plus the idempotence guard in setBaseAudioSuppressed, makes supersede,
     * promote, lease expiry, clear-all and the duration cap all correct without a call each —
     * every one of those paths ends in triggerFire or triggerStop.
     *
     * typeof-guarded because three tests compile this region in isolation with `new Function`,
     * where the helper is outside the slice. Same idiom the file already uses for isWallFollower.
     */
    function triggerSyncAudio() {
      if (typeof setBaseAudioSuppressed !== 'function') return;
      try { setBaseAudioSuppressed(!!(triggerActive && triggerActive.coversBase)); } catch (e) {}
    }

    /*
     * Render a trigger's playlist into the overlay layer.
     *
     * ⚠️ Reuses showZoneItem — the SAME rotation engine the base playlist and every layout zone use
     * — with its own container and its own timer store. Not a second renderer: per-item durations,
     * video-on-end advance and per-item scheduling all come free, and there is one place where a
     * rendering bug can live rather than two.
     *
     * ⚠️ It composites over base video rather than preempting it. Verified on an XT245 (BOS 10.0.16)
     * on 2026-08-22: two simultaneous decodes, both advancing, both composited. See §9.
     */
    function triggerFire(trigger, source, carriedLease) {
      const container = document.getElementById('pipContainer');
      if (!container) return false;
      /*
       * ⚠️ YOUTUBE ITEMS ARE DROPPED FROM A TRIGGER PLAYLIST, and this is a containment fix rather
       * than a policy: createYoutubeEmbed is a SINGLETON shared with the base playlist. It does
       * ++ytGeneration and activeYtPlayer.destroy() on entry, so a YouTube item inside a trigger
       * DESTROYS the base playlist's player outright — and triggerStop has no path to rebuild it,
       * so the base is stuck on a dead item for the rest of its life. Its error path is worse
       * still: `if (playlist.length > 1) setTimeout(nextItem, 2000)` reads the BASE playlist, so a
       * bad video id inside a trigger silently advances the content underneath it.
       *
       * It is also unpinnable, which already violates this feature's foundation — the target is a
       * playlist rather than a URL precisely so every item is library content that can be held on
       * disk. A trigger item that needs the WAN is not a trigger item.
       *
       * Dropped here rather than only refused at the API because definitions are cached on devices
       * in the field, and a definition saved before this existed must not be able to wedge a panel.
       */
      let items = Array.isArray(trigger.items) ? trigger.items : [];
      const yt = items.filter((i) => i && (i.mime_type === 'video/youtube' || i.youtube_id));
      if (yt.length) {
        items = items.filter((i) => !(i && (i.mime_type === 'video/youtube' || i.youtube_id)));
        triggerLog('warn', `"${trigger.name}": dropped ${yt.length} YouTube item(s) — not playable `
          + 'offline, and the embed is shared with the base playlist');
      }
      if (!items.length) {
        // A fire against nothing is the failure the pinning work exists to prevent, so it is loud.
        triggerLog('warn', `"${trigger.name}" fired but its playlist is empty on this device`);
        return false;
      }
      triggerStop('superseded');

      const box = document.createElement('div');
      box.className = 'trigger-box';
      box.style.cssText = 'position:absolute;inset:0;background:#000;overflow:hidden;';
      // Latched so media inside is recognised as overlay even when DETACHED — the transition path
      // warm-plays a <video> before appending it, and #146 left detached elements still decoding.
      box.__stOverlay = true;
      container.appendChild(box);

      triggerActive = {
        trigger, mode: trigger.mode, since: Date.now(), source,
        /*
         * ⚠️ Whether the overlay COVERS the screen — computed here, beside the line that decides
         * the box's shape, so the two can never drift. Today it is unconditionally true because
         * the box is hardcoded inset:0 opaque; geometry is reserved at the API for exactly that
         * reason. If a banner/partial mode is ever added, this expression changes on the same
         * line as the style and the audio rule follows automatically.
         *
         * Base audio is suppressed from THIS, never from `triggerActive !== null`: a trigger that
         * only covers a corner leaves the base visible, and silencing it would be wrong.
         */
        coversBase: true,
        // A restored trigger keeps the lease it had — being covered for a while is not a renewal,
        // and resetting the clock would let a preemption silently extend a lapsed assertion.
        leaseUntil: carriedLease !== undefined ? carriedLease : triggerLeaseUntil(trigger),
      };
      if (!triggerLeaseTimer) {
        triggerLeaseTimer = setInterval(triggerLeaseSweep, 5000);
        if (triggerLeaseTimer && triggerLeaseTimer.unref) triggerLeaseTimer.unref();
      }
      /*
       * ⚠️ WRAPPED. Everything above has already committed: the previous overlay is gone, the box
       * is on screen and triggerActive is set. A throw out of the renderer would leave an opaque
       * black box with no content, the base silenced, and — because this runs inside the HTTP
       * handler — the response never sent, so the control processor blocks to timeout. That is the
       * same wedge triggerStop was hardened against; the fire path was left open.
       */
      try {
        showZoneItem({ id: '__trigger__' }, box, items, 0, triggerTimers);
      } catch (e) {
        triggerLog('warn', `"${trigger.name}" failed to render: ${(e && e.message) || e}`);
        triggerStop('render failed');
        return false;
      }
      triggerSyncAudio();

      /*
       * `once` = play the playlist through once. max_duration_sec is an UPPER BOUND, not the
       * primary control, and 0 means no cap. ⚠️ Deliberately unlike the PiP `duration` field where
       * 0 means "until cleared" — hence the different name. The cap wins over a longer playlist,
       * because a safety valve that defers to the thing it is guarding is not a safety valve.
       */
      const cap = Number(trigger.max_duration_sec) || 0;
      if (trigger.mode === 'once') {
        /*
         * ⚠️ `once` NEEDS AN EXPLICIT STOP. showZoneItem rotates forever — that is right for a zone
         * and wrong here, so without this a "play once" trigger would loop until something cleared
         * it, which is the behaviour of the other mode entirely.
         *
         * ⚠️ The natural length is ESTIMATED from duration_sec, and for video that is a guess: a
         * video item advances on `ended`, so its real length is whatever the file is, not what the
         * field says. A clip longer than its duration_sec is cut short; a shorter one leaves the
         * last frame up until the estimate elapses. Stated rather than hidden — making it exact
         * needs the rotation engine to report a wrap, which is a change to a path the base playlist
         * shares and not worth the blast radius here.
         */
        const natural = items.reduce((n, i) => n + (Number(i.duration_sec) || 10), 0);
        const stopAfter = cap > 0 ? Math.min(cap, natural) : natural;
        if (cap > 0 && natural > cap) {
          triggerLog('warn', `"${trigger.name}" capped at ${cap}s (playlist needs ${natural}s)`);
        }
        triggerCapTimer = setTimeout(() => {
          triggerStop(cap > 0 && cap <= natural ? 'cap reached' : 'played once');
          triggerPromote();
        }, stopAfter * 1000);
      }
      triggerLog('info', `fired "${trigger.name}" via ${source} (${trigger.mode}, ${items.length} item(s))`);
      reportTriggerStatus();
      // ⚠️ The return value is load-bearing: the arbitration path pushes the outgoing trigger onto
      // the held list BEFORE calling this, and un-pushes it when this reports false. Otherwise a
      // trigger that never rendered leaves the previous one both active and held, and clearing it
      // fires it straight back.
      return true;
    }

    /**
     * The ONE handler. Both transports arrive here; neither has logic of its own.
     */
    function handleTrigger({ text, source, sourceIp }) {
      triggerStats.received++;
      triggerStats.last_datagram_at = Date.now();   // ⚠️ counted even when rejected — see below
      const TRcore = window.TriggerResolve;
      if (!TRcore) return { ok: false, reason: 'malformed' };

      if (triggerLimiter && !triggerLimiter.allow(sourceIp || 'unknown', Date.now())) {
        triggerStats.rejected.rate_limited++;
        triggerLog('warn', `rate limited from ${sourceIp || 'unknown'}`, 'rate_limited');
        return { ok: false, reason: 'rate_limited' };
      }

      const verdict = TRcore.evaluate({
        text, triggers, source,
        deviceSecret: triggerConfig.secret || '',
        clearAllToken: triggerConfig.clear_all_token || null,
      });

      if (!verdict.ok) {
        if (triggerStats.rejected[verdict.reason] !== undefined) triggerStats.rejected[verdict.reason]++;
        // bad_magic is broadcast noise and is NOT logged per packet — on a busy LAN that alone
        // would fill the ring buffer and push out everything worth reading.
        if (verdict.reason !== 'bad_magic') {
          triggerLog('warn', `refused from ${sourceIp || '?'}: ${verdict.reason}`, verdict.reason);
        }
        return verdict;
      }

      triggerStats.accepted++;
      if (verdict.action === 'clear_all') {
        // ⚠️ Clear-all empties the held set too. "Stop everything" that leaves something queued to
        // reappear a moment later is not stop everything.
        triggerHeld = [];
        triggerStop('clear-all');
      } else if (verdict.action === 'clear') {
        if (triggerActive && triggerActive.trigger.id === verdict.trigger.id) {
          triggerStop('cleared');
          triggerPromote();
        } else {
          // Clearing something that is HELD must remove it, or it comes back when the overlay
          // above it clears — after the operator already told it to stop.
          const before = triggerHeld.length;
          triggerHeld = triggerHeld.filter((h) => h.trigger.id !== verdict.trigger.id);
          triggerLog('info', triggerHeld.length !== before
            ? `cleared held "${verdict.trigger.name}"`
            : `clear for "${verdict.trigger.name}" but it is not showing or held`);
        }
      } else if (verdict.action === 'fire') {
        const incoming = verdict.trigger;
        /*
         * ⚠️ A RE-FIRE OF THE ALREADY-ACTIVE TRIGGER IS A NO-OP, NOT A RESTART — but it DOES renew
         * the lease. Crestron and PLC gear re-assert state on a timer, and subnet broadcast
         * duplicates packets anyway. If every repeat restarted the overlay, a sender re-asserting
         * every 5s would freeze a 6-item emergency loop on item 1 forever, and it would look like
         * the playlist was broken rather than like the sender was chatty.
         *
         * The same repeat is the liveness signal the lease is built on, so one mechanism does two
         * jobs: the chatty sender stops being a nuisance and becomes the proof the alarm is real.
         */
        if (triggerActive && triggerActive.trigger.id === incoming.id) {
          triggerActive.leaseUntil = triggerLeaseUntil(incoming);
          triggerLog('info', `re-fire of "${incoming.name}" — already showing, lease renewed`,
                     're-fire-' + incoming.id);
        } else {
          const held = triggerHeld.find((h) => h.trigger.id === incoming.id);
          if (held) {
            /*
             * ⚠️ A RE-ASSERTION OF A HELD TRIGGER RENEWS IT WITHOUT DISTURBING THE SCREEN. Without
             * this, an alarm that stays true while a higher-priority overlay covers it would have
             * its lease quietly lapse — and would then NOT come back when the higher one cleared,
             * even though its sender never stopped saying it was true.
             */
            held.leaseUntil = triggerLeaseUntil(incoming);
            triggerLog('info', `held "${incoming.name}" re-asserted, lease renewed`, 'held-' + incoming.id);
          } else if (triggerActive && (incoming.priority || 0) < (triggerActive.trigger.priority || 0)) {
            // Lower priority while something more important is showing: dropped, and named on BOTH
            // sides, because "my trigger did nothing" is unanswerable without knowing what beat it.
            triggerLog('info',
              `"${incoming.name}" (p${incoming.priority || 0}) dropped — "${triggerActive.trigger.name}" ` +
              `(p${triggerActive.trigger.priority || 0}) is showing`, 'lost-' + incoming.id);
          } else {
            /*
             * Equal or higher priority takes the screen. Ties go to the last arrival, matching the
             * last-show-wins rule the manual PiP path has always used, so the triggered and manual
             * paths cannot disagree about what happens.
             */
            let heldEntry = null;
            if (triggerActive && triggerActive.mode === 'until_cleared') {
              heldEntry = {
                trigger: triggerActive.trigger,
                source: triggerActive.source,
                leaseUntil: triggerActive.leaseUntil,
              };
              triggerHeld.push(heldEntry);
              triggerLog('info',
                `"${triggerActive.trigger.name}" held while "${incoming.name}" shows`);
            }
            /*
             * ⚠️ UN-HOLD IF THE INCOMING TRIGGER NEVER RENDERED. triggerFire bails out for an
             * empty playlist (including one emptied by the YouTube drop) or a missing container,
