# ScreenTinker: sound to EVERY output at once.
#
# A signage Pi does not know which output has a speaker on it (HDMI 0, HDMI 1 or the headphone jack),
# so one combined sink mirrors the player's audio to all of them and is the default. Installed into
# the player user's own PipeWire config: the Lite service's `screentinker` user by the package, the
# desktop login user by `screentinker-pi setup --mode desktop` (no other user is touched).
context.modules = [
  { name = libpipewire-module-combine-stream
    args = {
      combine.mode = sink
      node.name = "screentinker_all_outputs"
      node.description = "All outputs (ScreenTinker)"
      combine.latency-compensate = false
      combine.props = {
        audio.position = [ FL FR ]
        priority.session = 3000
        priority.driver = 3000
      }
      stream.rules = [
        { matches = [ { media.class = "Audio/Sink" node.name = "~alsa_output.*" } ]
          actions = { create-stream = { } } }
      ]
    }
  }
]
